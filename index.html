<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التسجيل — صنّاع الحلول الابتكارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--navy:#0B1B3F;--teal:#14B8A6;--bg:#FBF6E9;--line:#e7ddc0;--ink:#1c2230;--muted:#6b7280;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;}
  h1,h2,h3{font-family:'Tajawal',sans-serif;margin:0;}
  .topbar{background:var(--navy);padding:30px 24px 34px;text-align:center;position:relative;overflow:hidden;}
  .topbar::after{content:'';position:absolute;left:-40px;top:18px;width:140%;height:3px;
    background:var(--teal);transform:rotate(-6deg);opacity:.55;}
  .topbar h1{color:#fff;font-size:25px;position:relative;}
  .topbar .sub{color:var(--teal);font-size:13px;font-weight:700;margin-top:8px;position:relative;}
  .topbar .meta{color:#cfd6e4;font-size:12.5px;margin-top:10px;position:relative;}
  main{max-width:660px;margin:0 auto;padding:22px 16px 70px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;
    box-shadow:0 8px 24px rgba(11,27,63,.05);}
  label{display:block;font-size:13.5px;font-weight:700;color:var(--navy);margin:14px 0 6px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:15px;background:#fff;color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .hint{font-size:12px;color:var(--muted);margin-top:5px;}
  .modes{display:flex;gap:8px;margin-bottom:4px;}
  .modes button{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:14.5px;color:var(--navy);cursor:pointer;}
  .modes button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .opt{display:block;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer;}
  .opt input{display:none;}
  .opt.sel{border-color:var(--teal);background:#f2fbf9;}
  .opt .t{font-weight:700;color:var(--navy);font-size:14.5px;}
  .opt .d{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.65;}
  .member{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#fffdf7;}
  .member .head{display:flex;justify-content:space-between;align-items:center;}
  .member .head b{font-family:'Tajawal',sans-serif;color:var(--navy);font-size:14px;}
  .member .rm{background:none;border:none;color:#9c2b2b;font-size:13px;cursor:pointer;font-family:inherit;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:520px){.grid2{grid-template-columns:1fr;}}
  .add{width:100%;background:#fff;border:1.5px dashed var(--line);color:var(--navy);border-radius:10px;
    padding:12px;font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
  .submit{width:100%;margin-top:18px;background:var(--teal);color:#fff;border:none;border-radius:12px;
    padding:15px;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:700;cursor:pointer;}
  .submit:disabled{opacity:.55;cursor:not-allowed;}
  .msg{margin-top:12px;font-size:13.5px;padding:11px 13px;border-radius:9px;display:none;line-height:1.7;}
  .msg.err{background:#fdecec;color:#9c2b2b;display:block;}
  .hide{display:none !important;}
  .done{text-align:center;padding:34px 20px;}
  .done .code{font-family:'Tajawal',sans-serif;font-size:34px;font-weight:900;color:var(--navy);
    letter-spacing:2px;margin:14px 0 6px;direction:ltr;}
  .done .note{font-size:13.5px;color:var(--muted);line-height:1.9;}
  .closed{text-align:center;padding:44px 24px;color:var(--muted);font-size:15px;line-height:1.9;}

  .brandmark{display:flex;align-items:center;gap:11px;}
  .brandmark img{height:30px;display:block;}
  .brandmark .sep{width:1px;height:24px;background:rgba(255,255,255,.22);}
  @media(max-width:520px){ .brandmark img{height:24px;} }
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;justify-content:center;margin-bottom:18px;position:relative;"><div class="brandmark">
      <img src="logo-qu.png" alt="جامعة القصيم">
      <span class="sep"></span>
      <img src="logo-mim.png" alt="وزارة الصناعة والثروة المعدنية">
    </div></div>
  <h1>صنّاع الحلول الابتكارية</h1>
  <div class="sub">نحو حلول مبتكرة تصنع أثرًا مستدامًا</div>
  <div class="meta">جامعة القصيم · 13–14 سبتمبر · 12:30 م – 4:00 م</div>
</div>

<main>
  <div class="card hide" id="closedCard"><div class="closed" id="closedMsg"></div></div>

  <div id="formWrap" class="hide">
    <div class="card">
      <div class="modes">
        <button id="mTeam" class="on" onclick="setMode('team')">تسجيل فريق</button>
        <button id="mSolo" onclick="setMode('solo')">تسجيل فردي</button>
      </div>
      <div class="hint" id="modeHint">سجّل فريقك كاملًا الآن، وأول عضو تدخله هو قائد الفريق.</div>
    </div>

    <div class="card">
      <h3 style="color:var(--navy);font-size:16px;">المسار</h3>
      <div id="tracksBox" style="margin-top:12px;"></div>

      <h3 style="color:var(--navy);font-size:16px;margin-top:22px;">التحدي</h3>
      <div id="challengesBox" style="margin-top:12px;">
        <div class="hint">اختر المسار أولًا.</div>
      </div>
    </div>

    <div class="card" id="teamCard">
      <label for="teamName">اسم الفريق</label>
      <input type="text" id="teamName" autocomplete="off">

      <div id="membersBox" style="margin-top:18px;"></div>
      <button class="add" onclick="addMember()">+ إضافة عضو</button>
      <div class="hint" id="sizeHint"></div>
    </div>

    <div class="card hide" id="soloCard">
      <div id="soloBox"></div>
      <div class="hint">بنضمّك لفريق مناسب قبل انطلاق الفعالية ونتواصل معك.</div>
    </div>

    <button class="submit" id="submitBtn" onclick="submitForm()">إتمام التسجيل</button>
    <div class="msg" id="errMsg"></div>
  </div>

  <div class="card hide" id="doneCard">
    <div class="done">
      <div style="font-size:38px;">✅</div>
      <h2 style="color:var(--navy);margin-top:10px;" id="doneTitle"></h2>
      <div class="code hide" id="doneCode"></div>
      <div class="note" id="doneNote"></div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
let mode = 'team';
let tracks = [], challenges = [], settings = {};
let selTrack = null, selChallenge = null;
let memberCount = 0;

function catOptions(){
  return '<option value="">— اختر الفئة —</option>' +
    CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
}

async function init(){
  const [{ data: st }, { data: tr }, { data: ch }, { data: s }] = await Promise.all([
    supabaseClient.rpc('registration_status'),
    supabaseClient.from('tracks').select('*').order('sort_order'),
    supabaseClient.from('challenges').select('*').order('track_id, number'),
    supabaseClient.from('app_settings').select('*').eq('id', 1).single(),
  ]);

  const status = (st && st[0]) || { is_open: true };
  if(!status.is_open){
    document.getElementById('closedCard').classList.remove('hide');
    document.getElementById('closedMsg').textContent = status.message || 'التسجيل غير متاح حاليًا.';
    return;
  }

  tracks = tr || []; challenges = ch || []; settings = s || { min_team_size:2, max_team_size:5 };
  document.getElementById('sizeHint').textContent =
    `عدد أعضاء الفريق من ${settings.min_team_size} إلى ${settings.max_team_size}، شاملًا القائد.`;

  renderTracks();
  addMember(); addMember();
  renderSolo();
  document.getElementById('formWrap').classList.remove('hide');
}

function renderTracks(){
  document.getElementById('tracksBox').innerHTML = tracks.map(t => `
    <label class="opt ${selTrack===t.id?'sel':''}" onclick="pickTrack('${t.id}')">
      <div class="t">${t.name_ar}</div>
    </label>`).join('');
}

function pickTrack(id){
  selTrack = id; selChallenge = null;
  renderTracks(); renderChallenges();
}

function renderChallenges(){
  const list = challenges.filter(c => c.track_id === selTrack);
  const box = document.getElementById('challengesBox');
  if(!list.length){ box.innerHTML = '<div class="hint">اختر المسار أولًا.</div>'; return; }
  box.innerHTML = list.map(c => `
    <label class="opt ${selChallenge===c.id?'sel':''}" onclick="pickChallenge('${c.id}')">
      <div class="t">التحدي ${c.number === 1 ? 'الأول' : 'الثاني'}</div>
      <div class="d">${c.title_ar}</div>
    </label>`).join('');
}

function pickChallenge(id){ selChallenge = id; renderChallenges(); }

function setMode(m){
  mode = m;
  document.getElementById('mTeam').classList.toggle('on', m === 'team');
  document.getElementById('mSolo').classList.toggle('on', m === 'solo');
  document.getElementById('teamCard').classList.toggle('hide', m !== 'team');
  document.getElementById('soloCard').classList.toggle('hide', m !== 'solo');
  document.getElementById('modeHint').textContent = m === 'team'
    ? 'سجّل فريقك كاملًا الآن، وأول عضو تدخله هو قائد الفريق.'
    : 'سجّل نفسك بشكل فردي، وبنضمّك لفريق قبل انطلاق الفعالية.';
}

function memberFields(i, isLeader){
  return `
  <div class="member" id="mem-${i}">
    <div class="head">
      <b>${isLeader ? 'قائد الفريق' : 'عضو ' + i}</b>
      ${isLeader ? '' : `<button class="rm" onclick="removeMember(${i})">حذف</button>`}
    </div>
    <div class="grid2" style="margin-top:10px;">
      <div><label for="n-${i}">الاسم الكامل</label><input type="text" id="n-${i}"></div>
      <div><label for="e-${i}">البريد الإلكتروني</label><input type="email" id="e-${i}" dir="ltr" style="text-align:right;"></div>
      <div><label for="p-${i}">رقم الجوال</label><input type="tel" id="p-${i}" dir="ltr" style="text-align:right;" placeholder="05xxxxxxxx"></div>
      <div><label for="o-${i}">الجهة (اختياري)</label><input type="text" id="o-${i}"></div>
    </div>
    <label for="c-${i}">الفئة</label>
    <select id="c-${i}">${catOptions()}</select>
  </div>`;
}

function addMember(){
  if(memberCount >= (settings.max_team_size || 5)){
    showErr(`الحد الأعلى ${settings.max_team_size} أعضاء.`); return;
  }
  memberCount++;
  document.getElementById('membersBox').insertAdjacentHTML('beforeend', memberFields(memberCount, memberCount === 1));
}

function removeMember(i){
  const el = document.getElementById('mem-' + i);
  if(el) el.remove();
}

function renderSolo(){
  document.getElementById('soloBox').innerHTML = `
    <div class="grid2">
      <div><label for="sn">الاسم الكامل</label><input type="text" id="sn"></div>
      <div><label for="se">البريد الإلكتروني</label><input type="email" id="se" dir="ltr" style="text-align:right;"></div>
      <div><label for="sp">رقم الجوال</label><input type="tel" id="sp" dir="ltr" style="text-align:right;" placeholder="05xxxxxxxx"></div>
      <div><label for="so">الجهة (اختياري)</label><input type="text" id="so"></div>
    </div>
    <label for="sc">الفئة</label>
    <select id="sc">${catOptions()}</select>`;
}

function showErr(t){
  const el = document.getElementById('errMsg');
  el.className = 'msg err'; el.textContent = t;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
}
function clearErr(){ document.getElementById('errMsg').className = 'msg'; }

function collectMembers(){
  const out = [];
  document.querySelectorAll('#membersBox .member').forEach(el => {
    const i = el.id.split('-')[1];
    const v = id => (document.getElementById(id + '-' + i) || {}).value || '';
    const name = v('n').trim();
    if(!name && !v('e').trim() && !v('p').trim()) return;  // صف فارغ — نتجاهله
    out.push({
      full_name: name, email: v('e').trim(), phone: v('p').trim(),
      organization: v('o').trim(), category: v('c'),
    });
  });
  return out;
}

async function submitForm(){
  clearErr();
  const btn = document.getElementById('submitBtn');

  if(!selTrack)     return showErr('اختر المسار.');
  if(!selChallenge) return showErr('اختر التحدي.');

  btn.disabled = true; btn.textContent = 'جاري التسجيل...';

  try{
    if(mode === 'team'){
      const teamName = document.getElementById('teamName').value.trim();
      if(!teamName) throw new Error('اكتب اسم الفريق.');

      const members = collectMembers();
      if(members.length < settings.min_team_size)
        throw new Error(`الفريق يحتاج ${settings.min_team_size} أعضاء على الأقل.`);
      for(const m of members){
        if(!m.full_name || !m.email || !m.phone)
          throw new Error('كل عضو يحتاج اسمًا وبريدًا ورقم جوال.');
      }

      const { data, error } = await supabaseClient.rpc('register_team', {
        p_team_name: teamName, p_track_id: selTrack,
        p_challenge_id: selChallenge, p_members: members,
      });
      if(error) throw new Error(error.message);

      const code = (data && data[0] && data[0].team_code) || '';
      document.getElementById('formWrap').classList.add('hide');
      document.getElementById('doneCard').classList.remove('hide');
      document.getElementById('doneTitle').textContent = 'تم تسجيل الفريق';
      const codeEl = document.getElementById('doneCode');
      codeEl.textContent = code; codeEl.classList.remove('hide');
      document.getElementById('doneNote').innerHTML =
        'احتفظ برمز الفريق — تدخلون فيه لبوابة الفريق لتسليم المشروع.<br>' +
        'الدخول برمز الفريق + جوال أي عضو من الأعضاء.';
    } else {
      const v = id => (document.getElementById(id) || {}).value || '';
      if(!v('sn').trim() || !v('se').trim() || !v('sp').trim())
        throw new Error('اكتب الاسم والبريد ورقم الجوال.');

      const { error } = await supabaseClient.rpc('register_individual', {
        p_full_name: v('sn').trim(), p_email: v('se').trim(), p_phone: v('sp').trim(),
        p_organization: v('so').trim(), p_category: v('sc'),
        p_track_id: selTrack, p_challenge_id: selChallenge,
      });
      if(error) throw new Error(error.message);

      document.getElementById('formWrap').classList.add('hide');
      document.getElementById('doneCard').classList.remove('hide');
      document.getElementById('doneTitle').textContent = 'تم تسجيلك';
      document.getElementById('doneNote').textContent =
        'بنتواصل معك قبل انطلاق الفعالية لضمّك لفريق في المسار اللي اخترته.';
    }
  } catch(e){
    showErr(e.message || 'تعذّر إتمام التسجيل، حاول مرة أخرى.');
    btn.disabled = false; btn.textContent = 'إتمام التسجيل';
  }
}

init();
</script>
</body>
</html>
