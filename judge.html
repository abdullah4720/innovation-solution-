<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة المحكّم — صنّاع الحلول الابتكارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--navy:#0E1422;--surface:#151C2E;--surface-2:#1A2236;--line:#26314A;
    --teal:#35C9AE;--amber:#DB8A52;--text:#EAF0F8;--muted:#96A3B8;--bad:#E2706A;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy);color:var(--text);
    font-family:'IBM Plex Sans Arabic',sans-serif;padding-bottom:96px;}
  h1,h2,h3{font-family:'Tajawal',sans-serif;margin:0;}

  /* ---------- الرأس ---------- */
  .bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);}
  .bar .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;}
  .bar h1{font-size:15.5px;}
  .bar .who{font-size:12px;color:var(--muted);}
  .bar button.out{background:transparent;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:12.5px;}
  .brandmark{display:flex;align-items:center;gap:10px;}
  .brandmark img{height:26px;display:block;}
  .brandmark .sep{width:1px;height:22px;background:rgba(255,255,255,.22);}

  .prog{padding:0 18px 12px;}
  .prog .l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .prog .track{height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
  .prog .track i{display:block;height:100%;background:var(--teal);transition:width .25s;}

  /* ---------- شريط التنقّل ---------- */
  .nav{display:flex;gap:7px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav button{flex:0 0 auto;width:38px;height:38px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;}
  .nav button.part{border-color:var(--amber);color:var(--amber);}
  .nav button.done{background:rgba(53,201,174,.18);border-color:var(--teal);color:var(--teal);}
  .nav button.cur{outline:2px solid var(--teal);outline-offset:1px;}

  main{max-width:760px;margin:0 auto;padding:18px 16px 0;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;}

  /* ---------- اللجنة ---------- */
  .com .cn{font-family:'Tajawal',sans-serif;font-weight:700;font-size:15px;}
  .com .mm{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .com .chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted);}
  .com .chip.me{background:rgba(53,201,174,.16);border-color:var(--teal);color:var(--teal);font-weight:700;}

  /* ---------- المشروع ---------- */
  .ord{display:inline-block;background:var(--surface-2);border:1px solid var(--line);
    border-radius:8px;padding:4px 11px;font-size:12px;font-family:'Tajawal',sans-serif;font-weight:700;}
  .code{font-size:12px;color:var(--teal);direction:ltr;display:inline-block;}
  .pname{font-family:'Tajawal',sans-serif;font-weight:900;font-size:21px;margin-top:9px;}
  .meta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.8;}
  .warn{background:rgba(219,138,82,.12);border:1px solid rgba(219,138,82,.5);color:var(--amber);
    border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.75;margin-top:12px;}

  details.det{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
  details.det summary{cursor:pointer;font-size:13.5px;color:var(--teal);font-weight:600;list-style:none;}
  details.det summary::-webkit-details-marker{display:none;}
  details.det summary::before{content:'▸ ';}
  details.det[open] summary::before{content:'▾ ';}
  .ptitle{font-family:'Tajawal',sans-serif;font-weight:700;font-size:15px;margin-top:12px;}
  .ptext{font-size:13.5px;line-height:1.95;color:#C3CFE1;margin-top:8px;white-space:pre-wrap;}
  .flink{display:inline-block;margin-top:12px;margin-inline-end:8px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;padding:10px 16px;text-decoration:none;
    color:var(--teal);font-size:13px;font-weight:600;}

  /* ---------- المعايير ---------- */
  .crit{margin-bottom:20px;}
  .crit .t{font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;gap:10px;}
  .crit .t .w{color:var(--muted);font-weight:400;font-size:12.5px;}
  .crit .h{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.7;}
  .scale{display:flex;gap:7px;margin-top:10px;}
  .scale button{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
    border-radius:11px;padding:13px 0;font-family:'Tajawal',sans-serif;font-weight:700;
    font-size:16px;cursor:pointer;}
  .scale button.on{background:var(--teal);border-color:var(--teal);color:var(--navy);}
  .scale button:disabled{opacity:.45;cursor:not-allowed;}

  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;}
  textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14.5px;min-height:84px;
    resize:vertical;line-height:1.85;}
  textarea:focus{outline:1.5px solid var(--teal);border-color:var(--teal);}

  /* ---------- الشريط السفلي ---------- */
  .foot{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);
    border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;
    gap:12px;justify-content:center;}
  .foot .inner{width:100%;max-width:760px;display:flex;align-items:center;gap:10px;}
  .foot .sc{font-family:'Tajawal',sans-serif;font-weight:900;font-size:19px;min-width:64px;}
  .foot .sc small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;}
  .foot button{border:none;border-radius:11px;padding:13px 18px;cursor:pointer;
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:14.5px;}
  .foot .go{background:var(--teal);color:var(--navy);flex:1;}
  .foot .go:disabled{opacity:.45;cursor:not-allowed;}
  .foot .nx{background:transparent;border:1px solid var(--line);color:var(--text);}
  .doneflag{flex:1;background:rgba(53,201,174,.12);color:var(--teal);border-radius:11px;
    padding:13px;text-align:center;font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;}

  /* ---------- الدخول ---------- */
  .auth{max-width:400px;margin:60px auto;}
  .auth input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:12px;font-family:inherit;font-size:15px;}
  .auth button.primary{width:100%;background:var(--teal);color:var(--navy);border:none;
    border-radius:11px;padding:14px;font-family:'Tajawal',sans-serif;font-weight:700;
    font-size:15px;cursor:pointer;margin-top:16px;}
  .auth .hint{font-size:12.5px;color:var(--muted);line-height:1.85;margin-top:6px;}
  .msg{font-size:13px;padding:11px 13px;border-radius:9px;margin-top:12px;display:none;line-height:1.75;}
  .msg.err{background:rgba(226,112,106,.12);color:var(--bad);display:block;}
  .msg.ok{background:rgba(53,201,174,.12);color:var(--teal);display:block;}
  .hide{display:none !important;}
  .empty{text-align:center;color:var(--muted);padding:40px 18px;font-size:14px;line-height:1.95;}

  /* ---------- نافذة المراجعة ---------- */
  .modal{position:fixed;inset:0;background:rgba(6,10,18,.78);display:flex;align-items:center;
    justify-content:center;padding:18px;z-index:60;}
  .modal .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:24px;max-width:460px;width:100%;max-height:86vh;overflow:auto;}
  .modal h3{font-size:18px;}
  .modal .sub{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.85;}
  .modal .rw{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .modal .rw:last-of-type{border-bottom:none;}
  .modal .rw .v{font-family:'Tajawal',sans-serif;font-weight:700;}
  .modal .tot{display:flex;justify-content:space-between;background:rgba(53,201,174,.1);
    border:1px solid var(--teal);border-radius:11px;padding:13px;margin-top:14px;
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:15px;color:var(--teal);}
  .modal .cm{background:var(--surface-2);border-radius:10px;padding:11px;font-size:13px;
    line-height:1.85;margin-top:10px;color:#C3CFE1;white-space:pre-wrap;}
  .modal .acts{display:flex;gap:9px;margin-top:18px;}
  .modal .acts button{flex:1;border:none;border-radius:11px;padding:13px;cursor:pointer;
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:14.5px;}
  .modal .acts .go{background:var(--teal);color:var(--navy);}
  .modal .acts .back{background:transparent;border:1px solid var(--line);color:var(--text);}

  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--teal);
    color:var(--navy);padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:70;font-family:'Tajawal',sans-serif;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="bar" id="topbar">
  <div class="top">
    <div class="brandmark">
      <img data-logo="qu" alt="جامعة القصيم">
      <span class="sep"></span>
      <img data-logo="mim" alt="وزارة الصناعة والثروة المعدنية">
    </div>
    <h1>بوابة المحكّم</h1>
    <div style="display:flex;align-items:center;gap:9px;">
      <span class="who" id="whoami"></span>
      <button class="out hide" id="logoutBtn" onclick="logout()">خروج</button>
    </div>
  </div>
  <div id="progWrap" class="hide">
    <div class="prog">
      <div class="l"><span id="progText"></span><span id="comName"></span></div>
      <div class="track"><i id="progBar" style="width:0%"></i></div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
</div>

<main>
  <!-- التحقق -->
  <div class="auth card" id="checkCard">
    <h2 style="font-size:19px;">دخول المحكّم</h2>
    <div class="hint">أدخل بريدك ورقم جوالك المسجَّلين لدى فريق التنظيم.</div>
    <label for="cEmail">البريد الإلكتروني</label>
    <input type="email" id="cEmail" dir="ltr" style="text-align:right;">
    <label for="cPhone">رقم الجوال</label>
    <input type="tel" id="cPhone" dir="ltr" style="text-align:right;" placeholder="05xxxxxxxx">
    <button class="primary" id="checkBtn" onclick="checkJudge()">متابعة</button>
    <div class="msg" id="checkMsg"></div>
  </div>

  <!-- كلمة مرور أول مرة -->
  <div class="auth card hide" id="setCard">
    <h2 style="font-size:19px;">اختر كلمة مرورك</h2>
    <div class="hint" id="setWelcome"></div>
    <label for="sPass">كلمة المرور</label>
    <input type="password" id="sPass" autocomplete="new-password">
    <label for="sPass2">تأكيد كلمة المرور</label>
    <input type="password" id="sPass2" autocomplete="new-password">
    <div class="hint">6 خانات على الأقل.</div>
    <button class="primary" id="setBtn" onclick="setPassword()">حفظ والدخول</button>
    <div class="msg" id="setMsg"></div>
  </div>

  <!-- الدخول -->
  <div class="auth card hide" id="loginCard">
    <h2 style="font-size:19px;">أهلًا بك</h2>
    <div class="hint" id="loginWelcome"></div>
    <label for="lPass">كلمة المرور</label>
    <input type="password" id="lPass" autocomplete="current-password">
    <button class="primary" id="loginBtn" onclick="login()">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- مساحة التحكيم -->
  <div id="app" class="hide">
    <div class="card com" id="comCard"></div>
    <div id="stage"></div>
  </div>
</main>

<div class="foot hide" id="footBar"><div class="inner" id="footInner"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
let token = localStorage.getItem('sh_judge_token') || null;
let pending = null;
let criteria = [], teams = [], committees = [];
let cur = 0;

function msg(id, text, ok){
  const el = document.getElementById(id);
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
}
function show(id){
  ['checkCard','setCard','loginCard','app'].forEach(x =>
    document.getElementById(x).classList.toggle('hide', x !== id));
  document.getElementById('progWrap').classList.toggle('hide', id !== 'app');
  document.getElementById('footBar').classList.toggle('hide', id !== 'app');
}
let toastTimer = null;
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ==================== الدخول ==================== */
async function checkJudge(){
  const email = document.getElementById('cEmail').value.trim();
  const phone = document.getElementById('cPhone').value.trim();
  if(!email || !phone){ msg('checkMsg','يُرجى إدخال البريد ورقم الجوال.'); return; }

  const btn = document.getElementById('checkBtn');
  btn.disabled = true; btn.textContent = 'جاري التحقق...';
  const { data, error } = await supabaseClient.rpc('judge_check', { p_email: email, p_phone: phone });
  btn.disabled = false; btn.textContent = 'متابعة';

  if(error || !data || !data.length){
    msg('checkMsg','هذا البريد أو الجوال غير مسجَّل كمحكّم. يُرجى التواصل مع فريق التنظيم.');
    return;
  }
  pending = { email, phone, full_name: data[0].full_name };
  if(data[0].must_set_password){
    document.getElementById('setWelcome').textContent = `${pending.full_name} — هذا أول دخول لك، فاختر كلمة مرور.`;
    show('setCard');
  } else {
    document.getElementById('loginWelcome').textContent = `${pending.full_name} — أدخل كلمة مرورك.`;
    show('loginCard');
  }
}

async function setPassword(){
  const p1 = document.getElementById('sPass').value;
  const p2 = document.getElementById('sPass2').value;
  if(p1.length < 6){ msg('setMsg','كلمة المرور 6 خانات على الأقل.'); return; }
  if(p1 !== p2){ msg('setMsg','كلمتا المرور غير متطابقتين.'); return; }

  const btn = document.getElementById('setBtn');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';
  const { data, error } = await supabaseClient.rpc('judge_set_password', {
    p_email: pending.email, p_phone: pending.phone, p_password: p1 });
  btn.disabled = false; btn.textContent = 'حفظ والدخول';
  if(error){ msg('setMsg', error.message); return; }
  token = data; localStorage.setItem('sh_judge_token', token);
  loadWorkspace();
}

async function login(){
  const pass = document.getElementById('lPass').value;
  if(!pass){ msg('loginMsg','يُرجى إدخال كلمة المرور.'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'جاري الدخول...';
  const { data, error } = await supabaseClient.rpc('judge_login', {
    p_email: pending.email, p_password: pass });
  btn.disabled = false; btn.textContent = 'دخول';
  if(error){ msg('loginMsg','كلمة المرور غير صحيحة.'); return; }
  token = data; localStorage.setItem('sh_judge_token', token);
  loadWorkspace();
}

function logout(){ localStorage.removeItem('sh_judge_token'); location.reload(); }

/* ==================== التحميل ==================== */
async function loadWorkspace(){
  const [{ data: crit }, { data: tms }, { data: coms }] = await Promise.all([
    supabaseClient.rpc('judge_criteria',  { p_token: token }),
    supabaseClient.rpc('judge_projects',  { p_token: token }),
    supabaseClient.rpc('judge_committee', { p_token: token }),
  ]);
  if(crit === null && tms === null){ logout(); return; }

  criteria   = crit || [];
  committees = coms || [];

  // ترتيب صريح: اللجنة ثم ترتيب المشروع داخلها، ثم رقم التسجيل عند التساوي.
  // لا نعتمد على ترتيب الدالة لأن PostgreSQL قد يُدمجها ويُسقِط ORDER BY.
  teams = (tms || []).slice().sort((a, b) =>
    String(a.committee_name || '').localeCompare(String(b.committee_name || ''), 'ar')
    || (Number(a.order_index) || 9999) - (Number(b.order_index) || 9999)
    || String(a.team_code || '').localeCompare(String(b.team_code || ''), 'ar'));

  if(pending) document.getElementById('whoami').textContent = pending.full_name;
  document.getElementById('logoutBtn').classList.remove('hide');
  show('app');

  // ابدأ من أول مشروع غير معتمد
  const next = teams.findIndex(t => !t.submitted);
  cur = next === -1 ? 0 : next;

  renderCommittee();
  renderAll();
}

function renderCommittee(){
  const box = document.getElementById('comCard');
  if(!committees.length){ box.classList.add('hide'); return; }
  box.classList.remove('hide');
  box.innerHTML = committees.map(c => `
    <div class="cn">${c.committee_name}</div>
    <div class="mm">${(c.members || []).map(m =>
      `<span class="chip ${m.is_me ? 'me' : ''}">${m.full_name}${m.is_me ? ' · أنت' : ''}</span>`).join('')}</div>
  `).join('<div style="height:14px"></div>');
}

/* ==================== الحالة ==================== */
function stateOf(t){
  if(t.submitted) return 'done';
  const n = Object.keys(t.my_scores || {}).length;
  return n ? 'part' : '';
}
function weightedTotal(scores){
  let num = 0, den = 0;
  criteria.forEach(c => {
    const v = (scores || {})[c.id];
    if(v == null) return;
    num += (v / c.max_score) * c.weight;
    den += c.weight;
  });
  return den ? Math.round(num / den * 1000) / 10 : 0;
}

function renderAll(){
  renderProgress();
  renderNav();
  renderStage();
  renderFoot();
}

function renderProgress(){
  const done = teams.filter(t => t.submitted).length;
  document.getElementById('progText').textContent =
    teams.length ? `اعتمدتَ ${done} من ${teams.length}` : '';
  document.getElementById('comName').textContent =
    committees.length ? committees[0].committee_name : '';
  document.getElementById('progBar').style.width =
    teams.length ? (done * 100 / teams.length) + '%' : '0%';
}

function renderNav(){
  document.getElementById('nav').innerHTML = teams.map((t, i) =>
    `<button class="${stateOf(t)} ${i === cur ? 'cur' : ''}"
       title="${t.team_name}" onclick="goTo(${i})">${t.order_index}</button>`).join('');
}

function goTo(i){
  if(i < 0 || i >= teams.length) return;
  cur = i;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderStage(){
  const stage = document.getElementById('stage');
  if(!teams.length){
    stage.innerHTML = `<div class="card"><div class="empty">
      لا توجد مشاريع مُسنَدة إليك حتى الآن.<br>يُرجى التواصل مع فريق التنظيم.</div></div>`;
    return;
  }

  const t = teams[cur];
  const p = t.project || {};
  const locked = t.submitted;
  const scores = t.my_scores || {};

  const critHtml = criteria.map(c => {
    const val = scores[c.id];
    const btns = Array.from({ length: c.max_score }, (_, k) => k + 1).map(n =>
      `<button class="${Number(val) === n ? 'on' : ''}" ${locked ? 'disabled' : ''}
         onclick="setScore('${c.id}',${n})">${n}</button>`).join('');
    return `<div class="crit">
      <div class="t"><span>${c.name_ar}</span><span class="w">${c.weight}% · من ${c.max_score}</span></div>
      ${c.hint_ar ? `<div class="h">${c.hint_ar}</div>` : ''}
      <div class="scale" id="sc-${c.id}">${btns}</div>
    </div>`;
  }).join('');

  stage.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="ord">المشروع ${t.order_index} من ${t.total_in_committee}</span>
        <span class="code">${t.team_code}</span>
      </div>
      <div class="pname">${t.team_name}</div>
      <div class="meta">${t.track_name}${t.challenge_title ? ' · ' + t.challenge_title : ''}</div>
      <div class="meta">الأعضاء: ${(t.members || []).join('، ')}</div>
      ${t.conflict ? `<div class="warn">جهتك تطابق جهة أحد أعضاء هذا الفريق. التقييم متاح، والقرار يعود إليك.</div>` : ''}

      <details class="det" ${p.title ? 'open' : ''}>
        <summary>تفاصيل المشروع</summary>
        ${p.title ? `<div class="ptitle">${p.title}</div>` : '<div class="ptext">لم يُسلَّم مشروع بعد.</div>'}
        ${p.summary  ? `<div class="ptext">${p.summary}</div>` : ''}
        ${p.solution ? `<div class="ptext"><b>الحل تقنيًا:</b> ${p.solution}</div>` : ''}
        ${p.impact   ? `<div class="ptext"><b>الأثر المتوقع:</b> ${p.impact}</div>` : ''}
        <div>
          ${p.file_url  ? `<a class="flink" href="${p.file_url}" target="_blank" rel="noopener">ملف العرض</a>` : ''}
          ${p.study_url ? `<a class="flink" href="${p.study_url}" target="_blank" rel="noopener">الدراسة</a>` : ''}
          ${p.video_url ? `<a class="flink" href="${p.video_url}" target="_blank" rel="noopener">الفيديو</a>` : ''}
        </div>
      </details>
    </div>

    <div class="card">
      <h3 style="font-size:16px;margin-bottom:16px;">التقييم</h3>
      ${critHtml}
      <label for="cm">ملاحظاتك للفريق</label>
      <textarea id="cm" ${locked ? 'disabled' : ''}
        placeholder="ملاحظة موجزة تفيد الفريق…">${t.my_comment || ''}</textarea>
      <div class="msg" id="tm"></div>
    </div>`;
}

function renderFoot(){
  const inner = document.getElementById('footInner');
  if(!teams.length){ inner.innerHTML = ''; return; }
  const t = teams[cur];
  const total = weightedTotal(t.my_scores);
  const scored = criteria.filter(c => (t.my_scores || {})[c.id] != null).length;
  const complete = criteria.length && scored === criteria.length;

  inner.innerHTML = `
    <button class="nx" onclick="goTo(${cur - 1})" ${cur === 0 ? 'disabled style="opacity:.4"' : ''}>السابق</button>
    <div class="sc" style="color:${complete ? 'var(--teal)' : 'var(--muted)'}">
      ${complete ? total + '%' : scored + '/' + criteria.length}
      <small>${complete ? 'النتيجة' : 'معايير'}</small></div>
    ${t.submitted
      ? `<div class="doneflag">تم الاعتماد</div>`
      : `<button class="go" ${complete ? '' : 'disabled'} onclick="openReview()">
           ${complete ? 'مراجعة واعتماد' : 'أكمل المعايير'}</button>`}
    <button class="nx" onclick="goTo(${cur + 1})" ${cur >= teams.length - 1 ? 'disabled style="opacity:.4"' : ''}>التالي</button>`;
}

/* ==================== الحفظ ==================== */
async function setScore(critId, value){
  const t = teams[cur];
  const { error } = await supabaseClient.rpc('judge_save_score', {
    p_token: token, p_team_id: t.team_id, p_criterion_id: critId, p_score: value });
  if(error){ msg('tm', error.message); return; }

  t.my_scores = t.my_scores || {};
  t.my_scores[critId] = value;

  const box = document.getElementById('sc-' + critId);
  if(box) [...box.children].forEach((b, i) => b.classList.toggle('on', i + 1 === value));
  renderNav(); renderFoot();
  toast('حُفظت');
}

function openReview(){
  const t = teams[cur];
  const comment = (document.getElementById('cm') || {}).value?.trim() || '';
  const rows = criteria.map(c => `
    <div class="rw"><span>${c.name_ar} <span style="color:var(--muted);">· ${c.weight}%</span></span>
      <span class="v">${t.my_scores[c.id]} / ${c.max_score}</span></div>`).join('');

  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'reviewModal';
  el.innerHTML = `
    <div class="box">
      <h3>مراجعة التقييم</h3>
      <div class="sub">${t.team_name} — <span dir="ltr">${t.team_code}</span><br>
        بعد الاعتماد لا يمكن تعديل الدرجات أو الملاحظات.</div>
      <div style="margin-top:16px;">${rows}</div>
      <div class="tot"><span>النتيجة الموزونة</span><span>${weightedTotal(t.my_scores)}%</span></div>
      ${comment ? `<div class="sub" style="margin-top:14px;">ملاحظاتك</div><div class="cm">${comment}</div>`
                : `<div class="sub" style="margin-top:14px;">لم تكتب ملاحظات.</div>`}
      <div class="acts">
        <button class="back" onclick="closeReview()">رجوع للتعديل</button>
        <button class="go" onclick="confirmSubmit()">اعتماد نهائي</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}
function closeReview(){
  const m = document.getElementById('reviewModal');
  if(m) m.remove();
}

async function confirmSubmit(){
  closeReview();
  const t = teams[cur];
  const comment = (document.getElementById('cm') || {}).value?.trim() || '';
  const { error } = await supabaseClient.rpc('judge_submit', {
    p_token: token, p_team_id: t.team_id, p_comment: comment || null });
  if(error){ msg('tm', error.message); return; }

  t.submitted = true; t.my_comment = comment;
  toast('تم الاعتماد');

  const next = teams.findIndex(x => !x.submitted);
  if(next !== -1){ goTo(next); } else { renderAll(); }
}

if(token) loadWorkspace(); else show('checkCard');
</script>
</body>
</html>
