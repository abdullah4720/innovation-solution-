<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الشهادة — صنّاع الحلول الابتكارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--bg:#0E1422;--surface:#151C2E;--surface-2:#1A2236;--line:#26314A;
    --teal:#35C9AE;--amber:#DB8A52;--text:#EAF0F8;--muted:#96A3B8;--bad:#E2706A;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;}
  h1,h2,h3{font-family:'Tajawal',sans-serif;margin:0;}
  main{max-width:900px;margin:0 auto;padding:26px 14px 70px;}
  .lookup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:420px;margin:40px auto;}
  label{display:block;font-size:12.5px;color:var(--muted);margin:13px 0 5px;}
  input{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:11px 12px;font-family:inherit;font-size:15px;width:100%;}
  input:focus{outline:1.5px solid var(--teal);border-color:var(--teal);}
  button.b{border:none;border-radius:10px;padding:12px 20px;font-family:'Tajawal',sans-serif;
    font-weight:700;font-size:14.5px;cursor:pointer;}
  .b-teal{background:var(--teal);color:#0E1422;}
  .b-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .msg{font-size:13px;padding:11px 13px;border-radius:9px;margin-top:12px;display:none;}
  .msg.err{background:rgba(226,112,106,.12);color:var(--bad);display:block;}
  .hide{display:none !important;}

  /* ---------- الشهادة ---------- */
  .cert{width:1000px;height:707px;background:#0E1422;color:#EAF0F8;position:relative;
    padding:58px 70px;overflow:hidden;transform-origin:top center;}
  .cert .rule{position:absolute;left:0;right:0;top:132px;height:1px;background:var(--teal);opacity:.5;}
  .cert .rule::after{content:'';position:absolute;right:70px;top:-3.5px;width:8px;height:8px;
    border-radius:50%;background:var(--teal);}
  .cert .brandline{display:flex;justify-content:space-between;align-items:flex-start;font-size:14px;color:#C6D1E2;}
  .cert .brandline b{font-family:'Tajawal';font-weight:700;display:block;font-size:16px;color:#fff;}
  .cert .brandline span{font-size:11.5px;color:var(--muted);}

  .cert .kicker{margin-top:74px;font-size:15px;color:var(--teal);font-weight:600;}
  .cert .title{font-family:'Tajawal';font-size:40px;font-weight:900;margin-top:6px;line-height:1.25;}
  .cert .lead{font-size:14.5px;color:var(--muted);margin-top:22px;}
  .cert .name{font-family:'Tajawal';font-size:46px;font-weight:900;color:var(--teal);margin-top:8px;}
  .cert .body{font-size:15px;color:#C6D1E2;line-height:2.05;margin-top:18px;max-width:640px;}
  .cert .body b{color:#fff;font-weight:600;}

  .cert .cube{position:absolute;left:66px;top:238px;width:196px;height:196px;opacity:.9;}
  .cert .foot{position:absolute;left:70px;right:70px;bottom:46px;display:flex;
    justify-content:space-between;align-items:flex-end;font-size:12px;color:var(--muted);}
  .cert .foot .code{direction:ltr;color:var(--teal);font-weight:600;letter-spacing:.5px;}
  .cert .sig{text-align:left;}
  .cert .sig .l{width:170px;height:1px;background:var(--line);margin-bottom:7px;}

  .stage{overflow-x:auto;padding-bottom:8px;}
  .actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  @media(max-width:1040px){ .cert{transform:scale(.62);} .stage{height:460px;} }
  @media(max-width:640px){  .cert{transform:scale(.35);} .stage{height:265px;} }
</style>
</head>
<body>
<main>
  <div class="lookup" id="lookup">
    <h2 style="font-size:19px;">التحقق من الشهادة</h2>
    <div style="font-size:12.5px;color:var(--muted);margin-top:5px;">أدخل رمز الشهادة للتحقق منها وتحميلها.</div>
    <label for="code">رمز الشهادة</label>
    <input type="text" id="code" dir="ltr" style="text-align:right;" placeholder="SH-XXXXXXXX">
    <button class="b b-teal" style="width:100%;margin-top:16px;" onclick="lookup()">عرض الشهادة</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="wrap" class="hide">
    <div class="stage">
      <div class="cert" id="cert">
        <div class="brandline">
          <div><b>جامعة القصيم</b><span>مركز الابتكار والملكية الفكرية</span></div>
          <div style="text-align:left;"><b>وزارة الصناعة والثروة المعدنية</b><span>Ministry of Industry and Mineral Resources</span></div>
        </div>
        <div class="rule"></div>

        <svg class="cube" viewBox="0 0 200 200" fill="none" aria-hidden="true">
          <g stroke="#35C9AE" stroke-width="1.4" opacity=".85">
            <path d="M100 22 L142 46 L142 94 L100 118 L58 94 L58 46 Z"/>
            <path d="M100 22 L100 70 M100 70 L142 46 M100 70 L58 46"/>
          </g>
          <path d="M100 84 L128 100 L100 116 L72 100 Z" fill="#35C9AE" opacity=".9"/>
          <g stroke="#26314A" stroke-width="1.1">
            <path d="M100 116 L156 148 L100 180 L44 148 Z"/>
            <path d="M72 132 L128 164 M128 132 L72 164"/>
          </g>
        </svg>

        <div style="margin-right:250px;">
          <div class="kicker">صنّاع الحلول الابتكارية</div>
          <div class="title">شهادة مشاركة</div>
          <div class="lead">تشهد اللجنة المنظِّمة بأن</div>
          <div class="name" id="cName"></div>
          <div class="body" id="cBody"></div>
        </div>

        <div class="foot">
          <div>رمز التحقق <span class="code" id="cCode"></span></div>
          <div class="sig"><div class="l"></div>اللجنة المنظِّمة</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="b b-teal" onclick="download('pdf')" id="pdfBtn">تحميل PDF</button>
      <button class="b b-ghost" onclick="download('png')" id="pngBtn">تحميل صورة</button>
      <button class="b b-ghost" onclick="location.href='participant.html'">بوابة المشارك</button>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
function param(k){ return new URLSearchParams(location.search).get(k); }

async function lookup(code){
  const c = (code || document.getElementById('code').value || '').trim();
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  if(!c) return;

  const { data, error } = await supabaseClient.rpc('get_certificate', { p_code: c });
  if(error || !data || !data.length){
    msg.className = 'msg err';
    msg.textContent = 'ما فيه شهادة بهذا الرمز.';
    return;
  }

  const r = data[0];
  document.getElementById('cName').textContent = r.full_name;

  const dates = [r.day1_date, r.day2_date].filter(Boolean)
    .map(d => new Date(d).toLocaleDateString('ar-SA', { day:'numeric', month:'long', year:'numeric' }));
  const when = dates.length === 2 ? `${dates[0]} و${dates[1]}` : (dates[0] || '');

  document.getElementById('cBody').innerHTML =
    `قد شارك في فعالية <b>صنّاع الحلول الابتكارية</b>` +
    (r.track_name ? ` ضمن <b>${r.track_name}</b>` : '') +
    (r.team_name ? `، مع فريق <b>${r.team_name}</b>` : '') +
    (r.project_title ? ` بمشروع <b>${r.project_title}</b>` : '') +
    (when ? `، وذلك بتاريخ ${when} بجامعة القصيم.` : '.') +
    `<br>نسأل الله لهم التوفيق والسداد.`;

  document.getElementById('cCode').textContent = c.toUpperCase();
  document.getElementById('lookup').classList.add('hide');
  document.getElementById('wrap').classList.remove('hide');
}

async function shot(){
  const node = document.getElementById('cert');
  const clone = node.cloneNode(true);
  clone.style.transform = 'none';
  clone.style.position = 'fixed';
  clone.style.top = '0';
  clone.style.left = '-99999px';
  document.body.appendChild(clone);
  const canvas = await html2canvas(clone, { scale: 2, backgroundColor: '#0E1422', useCORS: true });
  clone.remove();
  return canvas;
}

async function download(kind){
  const btn = document.getElementById(kind === 'pdf' ? 'pdfBtn' : 'pngBtn');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'جاري التجهيز...';
  try{
    const canvas = await shot();
    const name = document.getElementById('cName').textContent.replace(/\s+/g,'-');
    if(kind === 'png'){
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `شهادة-${name}.png`;
      a.click();
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:'landscape', unit:'pt', format:[1000, 707] });
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 1000, 707);
      pdf.save(`شهادة-${name}.pdf`);
    }
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

const c = param('code');
if(c){ document.getElementById('code').value = c; lookup(c); }
</script>
</body>
</html>
