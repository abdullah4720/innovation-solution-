<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الشهادة — صنّاع الحلول الابتكارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--bg:#0E1422;--surface:#151C2E;--surface-2:#1A2236;--line:#26314A;
    --teal:#35C9AE;--navy:#0E1938;--text:#EAF0F8;--muted:#96A3B8;--bad:#E2706A;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;}
  h1,h2,h3{font-family:'Tajawal',sans-serif;margin:0;}
  main{max-width:1240px;margin:0 auto;padding:26px 14px 70px;}
  .lookup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:420px;margin:50px auto;}
  label{display:block;font-size:12.5px;color:var(--muted);margin:13px 0 5px;}
  input{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:11px 12px;font-family:inherit;font-size:15px;width:100%;}
  input:focus{outline:1.5px solid var(--teal);border-color:var(--teal);}
  button.b{border:none;border-radius:10px;padding:12px 20px;font-family:'Tajawal',sans-serif;
    font-weight:700;font-size:14.5px;cursor:pointer;}
  .b-teal{background:var(--teal);color:#0E1422;}
  .b-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .msg{font-size:13px;padding:11px 13px;border-radius:9px;margin-top:12px;display:none;}
  .msg.err{background:rgba(226,112,106,.12);color:var(--bad);display:block;}
  .hide{display:none !important;}
  .verified{text-align:center;font-size:13px;color:var(--teal);margin-bottom:14px;}

  /* ==================== الشهادة ==================== */
  .cert{width:1160px;height:820px;background:#fff;color:var(--navy);position:relative;
    transform-origin:top center;font-family:'IBM Plex Sans Arabic',sans-serif;
    border:11px solid var(--teal);display:flex;flex-direction:column;overflow:hidden;}

  /* شريط الشعارات */
  .cert .logobar{height:132px;display:flex;align-items:center;justify-content:center;gap:30px;flex-shrink:0;}
  .cert .logobar img{height:62px;display:block;}
  .cert .logobar .sep{width:1px;height:56px;background:#C9D3E0;}

  /* الشريط النيفي */
  .cert .band{height:150px;background:var(--navy);position:relative;flex-shrink:0;overflow:hidden;
    display:flex;align-items:center;justify-content:flex-start;padding:0 44px;}
  .cert .band .streaks{position:absolute;inset:0;}
  .cert .band .streaks i{position:absolute;top:-40px;height:230px;width:15px;background:var(--teal);
    transform:rotate(22deg);opacity:.85;}
  .cert .band .streaks i:nth-child(1){right:auto;left:36px;opacity:.95;}
  .cert .band .streaks i:nth-child(2){left:74px;width:9px;opacity:.6;}
  .cert .band .streaks i:nth-child(3){left:104px;width:5px;opacity:.35;}
  .cert .band .badge{position:relative;border:2px solid rgba(53,201,174,.75);border-radius:10px;
    padding:13px 22px;text-align:center;background:rgba(255,255,255,.03);}
  .cert .band .badge .b1{font-family:'Tajawal';font-weight:900;font-size:21px;color:#fff;letter-spacing:3px;line-height:1.35;}
  .cert .band .badge .b2{font-size:9.5px;color:var(--teal);letter-spacing:1.2px;margin-top:5px;}

  /* المتن */
  .cert .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 96px;}
  .cert .h{font-family:'Tajawal';font-size:40px;font-weight:900;color:var(--navy);}
  .cert .divider{width:118px;height:3px;background:var(--teal);border-radius:2px;margin:24px 0 34px;}
  .cert .to{font-size:16.5px;color:#3C4A62;}
  .cert .name{font-family:'Tajawal';font-size:35px;font-weight:900;color:var(--navy);margin:26px 0 30px;
    line-height:1.35;max-width:860px;}
  .cert .l1{font-size:16.5px;color:#3C4A62;}
  .cert .l1 b{color:var(--navy);font-weight:700;}
  .cert .l2{font-size:16px;color:#3C4A62;margin-top:20px;}
  .cert .l3{font-size:14.5px;color:#64738A;margin-top:20px;}

  /* التذييل */
  .cert .rule{height:1px;background:#BFD8D4;margin:0 74px;flex-shrink:0;}
  .cert .foot{height:118px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 74px;font-size:12.5px;color:#64738A;}
  .cert .foot .mid{text-align:center;}
  .cert .foot .mid .t1{font-size:12.5px;}
  .cert .foot .mid .t2{font-family:'Tajawal';font-weight:700;font-size:16px;color:var(--navy);margin-top:8px;}
  .cert .foot .code{direction:ltr;}

  .stage{overflow-x:auto;padding-bottom:6px;}
  .actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;}
  @media(max-width:1210px){ .cert{transform:scale(.78);} .stage{height:660px;} }
  @media(max-width:940px){  .cert{transform:scale(.56);} .stage{height:475px;} }
  @media(max-width:640px){  .cert{transform:scale(.33);} .stage{height:285px;} }
</style>
</head>
<body>
<main>
  <div class="lookup" id="lookup">
    <h2 style="font-size:19px;">التحقق من الشهادة</h2>
    <div style="font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.8;">
      أدخل رمز الشهادة للتحقق من صحتها وتحميلها.
    </div>
    <label for="code">رمز الشهادة</label>
    <input type="text" id="code" dir="ltr" style="text-align:right;" placeholder="SH-XXXXXXXX">
    <button class="b b-teal" style="width:100%;margin-top:16px;" onclick="lookup()">عرض الشهادة</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="wrap" class="hide">
    <div class="verified">شهادة موثّقة وصادرة من المنصة</div>
    <div class="stage">
      <div class="cert" id="cert">
        <div class="logobar">
          <img src="logo-qu-dark.png" alt="جامعة القصيم">
          <span class="sep"></span>
          <img src="logo-mim-dark.png" alt="وزارة الصناعة والثروة المعدنية">
        </div>

        <div class="band">
          <div class="streaks"><i></i><i></i><i></i></div>
          <div class="badge">
            <div class="b1">صنّاع الحلول<br>الابتكارية</div>
            <div class="b2">INNOVATIVE SOLUTIONS MAKERS</div>
          </div>
        </div>

        <div class="body">
          <div class="h">شهادة مشاركة</div>
          <div class="divider"></div>
          <div class="to">يتقدّم مركز الابتكار والملكية الفكرية بجامعة القصيم بالشكر والتقدير إلى</div>
          <div class="name" id="cName"></div>
          <div class="l1" id="cL1"></div>
          <div class="l2" id="cL2"></div>
          <div class="l3" id="cL3"></div>
        </div>

        <div class="rule"></div>
        <div class="foot">
          <div id="cDate"></div>
          <div class="mid">
            <div class="t1">مع خالص الشكر والتقدير،</div>
            <div class="t2">فريق صنّاع الحلول الابتكارية</div>
          </div>
          <div>رمز التحقق: <span class="code" id="cCode"></span></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="b b-teal" onclick="download('pdf')" id="pdfBtn">تحميل PDF</button>
      <button class="b b-ghost" onclick="download('png')" id="pngBtn">تحميل صورة</button>
      <button class="b b-ghost" onclick="location.href='participant.html'">بوابة المشارك</button>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
function param(k){ return new URLSearchParams(location.search).get(k); }
function arDate(d){
  return d ? new Date(d).toLocaleDateString('ar-SA',{day:'numeric',month:'long',year:'numeric'}) : '';
}
function dayNum(d){ return d ? new Date(d).getDate() : null; }
function monthYear(d){
  return d ? new Date(d).toLocaleDateString('ar-SA',{month:'long',year:'numeric'}) : '';
}

async function lookup(code){
  const c = (code || document.getElementById('code').value || '').trim();
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  if(!c) return;

  const { data, error } = await supabaseClient.rpc('get_certificate', { p_code: c });
  if(error || !data || !data.length){
    msg.className = 'msg err';
    msg.textContent = 'ما فيه شهادة بهذا الرمز.';
    return;
  }

  const r = data[0];
  const f = String(r.gender || '').includes('أنث') || String(r.gender || '').includes('انث');

  document.getElementById('cName').textContent = r.full_name;

  document.getElementById('cL1').innerHTML =
    `على ${f ? 'مشاركتها المتميّزة' : 'مشاركته المتميّزة'} في <b>صنّاع الحلول الابتكارية</b>` +
    (r.track_name ? ` ضمن <b>${r.track_name.replace('مسار ','')}</b>` : '');

  const d1 = dayNum(r.day1_date), d2 = dayNum(r.day2_date);
  const period = (d1 && d2)
    ? `في الفترة من ${d1}-${d2} ${monthYear(r.day2_date)}`
    : (r.day1_date || r.day2_date ? `بتاريخ ${arDate(r.day1_date || r.day2_date)}` : '');
  document.getElementById('cL2').textContent =
    `${f ? 'وإتمامها' : 'وإتمامه'} متطلبات البرنامج بنجاح` + (period ? ` وذلك ${period}` : '');

  document.getElementById('cL3').textContent =
    `متمنين ${f ? 'لها' : 'له'} دوام التوفيق والنجاح في ${f ? 'مسيرتها' : 'مسيرته'} العلمية والمهنية.`;

  document.getElementById('cCode').textContent = c.toUpperCase();
  document.getElementById('cDate').textContent = arDate(new Date());
  document.getElementById('lookup').classList.add('hide');
  document.getElementById('wrap').classList.remove('hide');
}

async function shot(){
  const node = document.getElementById('cert');
  const clone = node.cloneNode(true);
  clone.style.transform = 'none';
  clone.style.position = 'fixed';
  clone.style.top = '0';
  clone.style.left = '-99999px';
  document.body.appendChild(clone);
  await Promise.all([...clone.querySelectorAll('img')].map(img =>
    img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; })));
  const canvas = await html2canvas(clone, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
  clone.remove();
  return canvas;
}

async function download(kind){
  const btn = document.getElementById(kind === 'pdf' ? 'pdfBtn' : 'pngBtn');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'جاري التجهيز...';
  try{
    const canvas = await shot();
    const name = document.getElementById('cName').textContent.replace(/\s+/g,'-');
    if(kind === 'png'){
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `شهادة-${name}.png`;
      a.click();
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.96), 'JPEG', 0, 0, 842, 595);
      pdf.save(`شهادة-${name}.pdf`);
    }
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

const c = param('code');
if(c){ document.getElementById('code').value = c; lookup(c); }
</script>
</body>
</html>
