<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقرير الختامي — صنّاع الحلول الابتكارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  :root{--navy:#0E1938;--ink:#1B2436;--teal:#35C9AE;--amber:#DB8A52;
    --line:#E3E8EF;--muted:#69788E;--bg:#F6F7F9;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;}
  h1,h2,h3{font-family:'Tajawal',sans-serif;margin:0;}

  /* الدخول */
  .login{max-width:380px;margin:14vh auto;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:28px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;}
  input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;
    font-family:inherit;font-size:15px;}
  button.b{border:none;border-radius:11px;padding:12px 18px;font-family:'Tajawal',sans-serif;
    font-weight:700;font-size:14.5px;cursor:pointer;}
  .b-teal{background:var(--teal);color:#fff;}
  .b-ghost{background:#fff;border:1px solid var(--line);color:var(--navy);}
  .msg{font-size:13px;padding:11px 13px;border-radius:9px;margin-top:12px;display:none;
    background:#fdecec;color:#9c2b2b;}
  .msg.on{display:block;}
  .hide{display:none !important;}

  .toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);
    padding:12px 20px;display:flex;gap:9px;justify-content:flex-end;align-items:center;}
  .toolbar .sp{flex:1;font-size:13px;color:var(--muted);}

  .page{max-width:940px;margin:0 auto;padding:26px 20px 80px;}

  .cover{background:var(--navy);color:#fff;border-radius:18px;padding:44px;margin-bottom:22px;
    position:relative;overflow:hidden;}
  .cover::after{content:'';position:absolute;left:-90px;bottom:-150px;width:420px;height:420px;
    border-radius:50%;background:radial-gradient(circle,rgba(53,201,174,.16) 0%,transparent 70%);}
  .cover .logos{display:flex;align-items:center;gap:18px;margin-bottom:28px;}
  .cover .logos img{height:44px;}
  .cover .logos .sep{width:1px;height:34px;background:#35507A;}
  .cover h1{font-size:34px;position:relative;}
  .cover .sub{color:var(--teal);font-size:15px;margin-top:10px;position:relative;}
  .cover .meta{font-size:13px;color:#B9C6DA;margin-top:20px;line-height:1.9;position:relative;}

  section{background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:24px;margin-bottom:18px;}
  section > h2{font-size:19px;padding-bottom:12px;border-bottom:2px solid var(--navy);}
  section .lead{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.9;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:18px;}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;}
  .kpi .n{font-family:'Tajawal',sans-serif;font-size:28px;font-weight:900;color:var(--navy);}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:5px;}

  table{width:100%;border-collapse:collapse;margin-top:16px;}
  th,td{padding:10px 11px;text-align:right;font-size:13px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-size:11.5px;font-weight:600;}
  tbody tr:last-child td{border-bottom:none;}

  .bar{height:8px;border-radius:999px;background:#EEF1F5;overflow:hidden;margin-top:6px;}
  .bar i{display:block;height:100%;background:var(--teal);}
  .bar.amber i{background:var(--amber);}

  .win{display:flex;align-items:center;gap:16px;border:1px solid var(--line);
    border-radius:14px;padding:18px;margin-top:12px;}
  .win .rk{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-family:'Tajawal',sans-serif;font-weight:900;font-size:17px;
    background:rgba(53,201,174,.14);color:#0F7A68;flex-shrink:0;}
  .win.safety .rk{background:rgba(219,138,82,.16);color:#9E5F33;}
  .win .nm{font-family:'Tajawal',sans-serif;font-weight:700;font-size:16px;}
  .win .pj{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .win .sc{margin-inline-start:auto;font-family:'Tajawal',sans-serif;font-weight:900;
    font-size:19px;color:var(--navy);}

  .quote{border-inline-start:3px solid var(--teal);padding:10px 14px;margin-top:10px;
    font-size:13px;line-height:1.9;color:#3C4A62;background:#FAFBFC;border-radius:0 8px 8px 0;}
  .chartbox{margin-top:18px;height:260px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:760px){ .two{grid-template-columns:1fr;} }

  @media print{
    body{background:#fff;}
    .toolbar{display:none;}
    .page{max-width:none;padding:0;}
    section{break-inside:avoid;border:none;padding:16px 0;border-bottom:1px solid var(--line);
      border-radius:0;margin-bottom:0;}
    .cover{border-radius:0;break-after:page;}
  }
</style>
</head>
<body>

<div class="login" id="loginCard">
  <h2 style="font-size:20px;">التقرير الختامي</h2>
  <div style="font-size:12.5px;color:var(--muted);margin-top:6px;">دخول فريق التنظيم.</div>
  <label for="le">البريد الإلكتروني</label>
  <input type="email" id="le" dir="ltr" style="text-align:right;">
  <label for="lp">كلمة المرور</label>
  <input type="password" id="lp">
  <button class="b b-teal" style="width:100%;margin-top:18px;" onclick="login()">دخول</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="app" class="hide">
  <div class="toolbar">
    <span class="sp" id="stamp"></span>
    <button class="b b-ghost" onclick="exportAll()">تصدير البيانات</button>
    <button class="b b-ghost" onclick="exportDeck()" id="pptBtn">تصدير PowerPoint</button>
    <button class="b b-teal" onclick="window.print()">طباعة / PDF</button>
  </div>
  <div class="page" id="page"></div>
</div>

<script src="config.js"></script>
<script>
let D = {};

supabaseClient.auth.onAuthStateChange(async (_e, session) => {
  if(!session) return;
  const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
  if(!prof){
    const m = document.getElementById('loginMsg');
    m.className = 'msg on'; m.textContent = 'هذا الحساب غير مُضاف إلى فريق التنظيم.';
    await supabaseClient.auth.signOut(); return;
  }
  document.getElementById('loginCard').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  load();
});
async function login(){
  const { error } = await supabaseClient.auth.signInWithPassword({
    email: document.getElementById('le').value.trim(),
    password: document.getElementById('lp').value });
  if(error){
    const m = document.getElementById('loginMsg');
    m.className = 'msg on'; m.textContent = 'بيانات الدخول غير صحيحة.';
  }
}

const arDate = d => d ? new Date(d).toLocaleDateString('ar-SA-u-ca-gregory',
  { day:'numeric', month:'long', year:'numeric' }) : '';

async function load(){
  const [tr,ch,tm,pp,pr,jd,cr,cm,cmm,ev,sv,st,rs] = await Promise.all([
    supabaseClient.from('tracks').select('*').order('sort_order'),
    supabaseClient.from('challenges').select('*'),
    supabaseClient.from('teams').select('*'),
    supabaseClient.from('participants').select('*'),
    supabaseClient.from('projects').select('*'),
    supabaseClient.from('judges').select('*'),
    supabaseClient.from('judging_criteria').select('*').order('sort_order'),
    supabaseClient.from('judging_committees').select('*'),
    supabaseClient.from('committee_members').select('*'),
    supabaseClient.from('judge_evaluations').select('*'),
    supabaseClient.rpc('survey_results'),
    supabaseClient.from('app_settings').select('*').eq('id',1).single(),
    supabaseClient.from('v_team_results').select('*'),
  ]);
  D = { tracks:tr.data||[], challenges:ch.data||[], teams:tm.data||[], people:pp.data||[],
        projects:pr.data||[], judges:jd.data||[], criteria:cr.data||[], committees:cm.data||[],
        comMembers:cmm.data||[], evals:ev.data||[], surveyQ:sv.data||[],
        settings:st.data||{}, results:(rs.data||[]) };
  render();
}

function avg(arr){ return arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*100)/100 : null; }

function render(){
  const { tracks, teams, people, projects, judges, criteria, committees,
          evals, surveys, settings, results } = D;

  const d1 = people.filter(p=>p.day1_attended).length;
  const d2 = people.filter(p=>p.day2_attended).length;
  const rate = people.length ? Math.round((d1+d2)*100/(people.length*2)) : 0;
  const certs = people.filter(p=>p.certificate_issued).length;
  const orgs = new Set(people.map(p=>(p.organization||'').trim()).filter(Boolean)).size;
  const submitted = projects.filter(p=>p.presentation_url).length;
  const done = evals.filter(e=>e.submitted).length;
  const expected = teams.filter(t=>t.committee_id).reduce((n,t) =>
    n + D.comMembers.filter(m=>m.committee_id===t.committee_id).length, 0);

  const byTrack = tracks.map(t => ({
    name: t.name_ar, id: t.id,
    teams: teams.filter(x=>x.track_id===t.id).length,
    people: people.filter(x=>x.track_id===t.id).length,
  }));
  const cats = {};
  people.forEach(p => { const c=(p.category||'غير محدد').trim(); cats[c]=(cats[c]||0)+1; });

  const ranked = {};
  tracks.forEach(t => {
    ranked[t.id] = results.filter(r=>r.track_id===t.id && r.final_score!=null)
                          .sort((a,b)=>b.final_score-a.final_score).slice(0,3);
  });

  const sq = (D.surveyQ || []).filter(q => Number(q.answers) > 0);
  const responded = sq.reduce((n,q) => Math.max(n, Number(q.answers||0)), 0);
  const numeric = sq.filter(q => q.qtype === 'rating10' || q.qtype === 'rating5');
  const overall = numeric.length
    ? Math.round(numeric.reduce((a,q) => a + (Number(q.avg_num)||0) /
        (q.qtype === 'rating5' ? 5 : 10), 0) / numeric.length * 100)
    : null;
  const comments = sq.filter(q => q.qtype === 'text')
    .flatMap(q => (q.texts || [])).filter(Boolean).slice(0, 5);
  const choices = sq.filter(q => q.qtype === 'choice');

  const flags = {
    cr: projects.filter(p=>p.has_commercial_register).length,
    pat: projects.filter(p=>p.has_patent).length,
    proto: projects.filter(p=>p.has_prototype).length,
  };

  document.getElementById('stamp').textContent = 'صدر في ' + arDate(new Date());

  document.getElementById('page').innerHTML = `
    <div class="cover">
      <div class="logos">
        <img data-logo="qu" alt="جامعة القصيم"><span class="sep"></span>
        <img data-logo="mim" alt="وزارة الصناعة والثروة المعدنية">
      </div>
      <h1>التقرير الختامي</h1>
      <div class="sub">صنّاع الحلول الابتكارية</div>
      <div class="meta">
        ${arDate(settings.day1_date)} — ${arDate(settings.day2_date)}<br>
        ${settings.event_location || 'جامعة القصيم'} · بالشراكة مع وزارة الصناعة والثروة المعدنية
      </div>
    </div>

    <section>
      <h2>الملخص التنفيذي</h2>
      <div class="lead">
        أقيمت فعالية صنّاع الحلول الابتكارية بالشراكة بين جامعة القصيم ووزارة الصناعة والثروة المعدنية،
        بمشاركة ${teams.length} فريقًا ضمّت ${people.length} مشاركًا من ${orgs} جهة،
        عملوا على تحديات واقعية في ${tracks.length} مسارات، وقُيّمت مشاريعهم من ${judges.length} محكّمين
        عبر ${criteria.length} معايير.
      </div>
      <div class="kpis">
        <div class="kpi"><div class="n">${teams.length}</div><div class="l">فريق مشارك</div></div>
        <div class="kpi"><div class="n">${people.length}</div><div class="l">مشارك</div></div>
        <div class="kpi"><div class="n">${orgs}</div><div class="l">جهة</div></div>
        <div class="kpi"><div class="n">${submitted}</div><div class="l">عرض مُسلَّم</div></div>
        <div class="kpi"><div class="n">${rate}%</div><div class="l">نسبة الحضور</div></div>
        <div class="kpi"><div class="n">${certs}</div><div class="l">شهادة صادرة</div></div>
      </div>
    </section>

    <section>
      <h2>المشاركة</h2>
      <div class="two">
        <div>
          <table>
            <thead><tr><th>المسار</th><th>الفرق</th><th>المشاركون</th></tr></thead>
            <tbody>${byTrack.map(t=>`<tr><td>${t.name}</td><td>${t.teams}</td><td>${t.people}</td></tr>`).join('')}
              <tr><td><b>الإجمالي</b></td><td><b>${teams.length}</b></td><td><b>${people.length}</b></td></tr>
            </tbody>
          </table>
        </div>
        <div class="chartbox"><canvas id="chTracks"></canvas></div>
      </div>

      <table style="margin-top:22px;">
        <thead><tr><th>الفئة</th><th>العدد</th><th style="width:45%;">النسبة</th></tr></thead>
        <tbody>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
          <tr><td>${k}</td><td>${v}</td>
            <td><div class="bar"><i style="width:${Math.round(v*100/people.length)}%"></i></div></td></tr>`).join('')}
        </tbody>
      </table>
    </section>

    <section>
      <h2>الحضور والشهادات</h2>
      <div class="kpis">
        <div class="kpi"><div class="n">${d1}</div><div class="l">حضور اليوم الأول</div></div>
        <div class="kpi"><div class="n">${d2}</div><div class="l">حضور اليوم الثاني</div></div>
        <div class="kpi"><div class="n">${people.filter(p=>p.day1_attended&&p.day2_attended).length}</div>
          <div class="l">حضروا اليومين</div></div>
        <div class="kpi"><div class="n">${certs}</div><div class="l">شهادة صادرة</div></div>
      </div>
      <div class="lead">
        شرط الشهادة: حضور ${settings.min_attendance_days === 2 ? 'اليومين' : 'يوم واحد على الأقل'}${
          settings.require_survey ? '، مع تعبئة استبيان التقييم' : ''}.
      </div>
    </section>

    <section>
      <h2>المشاريع</h2>
      <div class="kpis">
        <div class="kpi"><div class="n">${projects.length}</div><div class="l">مشروع مسجَّل</div></div>
        <div class="kpi"><div class="n">${submitted}</div><div class="l">عرض مرفوع</div></div>
        <div class="kpi"><div class="n">${flags.proto}</div><div class="l">نموذج مصغر</div></div>
        <div class="kpi"><div class="n">${flags.pat}</div><div class="l">براءة اختراع</div></div>
        <div class="kpi"><div class="n">${flags.cr}</div><div class="l">سجل تجاري</div></div>
      </div>
    </section>

    <section>
      <h2>التحكيم</h2>
      <div class="kpis">
        <div class="kpi"><div class="n">${judges.length}</div><div class="l">محكّم</div></div>
        <div class="kpi"><div class="n">${committees.length}</div><div class="l">لجنة</div></div>
        <div class="kpi"><div class="n">${done}</div><div class="l">تقييم معتمَد</div></div>
        <div class="kpi"><div class="n">${expected ? Math.round(done*100/expected) : 0}%</div>
          <div class="l">اكتمال التحكيم</div></div>
      </div>
      <table>
        <thead><tr><th>المعيار</th><th>الوزن</th><th>أعلى درجة</th></tr></thead>
        <tbody>${criteria.map(c=>`<tr><td>${c.name_ar}</td><td>${c.weight}%</td><td>${c.max_score}</td></tr>`).join('')}</tbody>
      </table>
    </section>

    <section>
      <h2>النتائج</h2>
      ${tracks.map(t => `
        <h3 style="font-size:15px;margin-top:18px;">${t.name_ar}</h3>
        ${(ranked[t.id]||[]).length ? ranked[t.id].map((r,ix)=>`
          <div class="win ${t.id}">
            <div class="rk">${ix+1}</div>
            <div><div class="nm">${r.name}</div>
              ${r.project_title?`<div class="pj">${r.project_title}</div>`:''}</div>
            <div class="sc">${r.final_score}%</div>
          </div>`).join('')
        : '<div class="lead">لم تكتمل نتائج هذا المسار.</div>'}
      `).join('')}
    </section>

    <section>
      <h2>رضا المشاركين</h2>
      ${responded ? `
      <div class="kpis">
        <div class="kpi"><div class="n">${responded}</div><div class="l">رد من ${people.length}</div></div>
        <div class="kpi"><div class="n">${overall ?? '—'}%</div><div class="l">متوسط الرضا العام</div></div>
        <div class="kpi"><div class="n">${numeric.length}</div><div class="l">محور مقيَّم</div></div>
      </div>
      <table>
        <thead><tr><th>السؤال</th><th>المتوسط</th><th style="width:35%;"></th></tr></thead>
        <tbody>${numeric.map(q => {
          const max = q.qtype === 'rating5' ? 5 : 10;
          const v = Number(q.avg_num) || 0;
          return `<tr><td>${q.question}</td><td>${q.avg_num ?? '—'} / ${max}</td>
            <td><div class="bar"><i style="width:${v/max*100}%"></i></div></td></tr>`;
        }).join('')}</tbody>
      </table>
      ${choices.map(q => {
        const b = q.breakdown || {};
        const tot = Object.values(b).reduce((a,c)=>a+Number(c),0) || 1;
        return `<h3 style="font-size:14.5px;margin-top:20px;">${q.question}</h3>
          <table><tbody>${Object.entries(b).map(([k,v])=>`
            <tr><td>${k}</td><td>${v}</td>
              <td style="width:35%;"><div class="bar amber"><i style="width:${v*100/tot}%"></i></div></td></tr>`).join('')}
          </tbody></table>`;
      }).join('')}
      ${comments.length ? `<h3 style="font-size:14.5px;margin-top:22px;">من ملاحظات المشاركين</h3>
        ${comments.map(c=>`<div class="quote">${c}</div>`).join('')}` : ''}
      ` : '<div class="lead">لم تصل ردود على الاستبيان.</div>'}
    </section>`;

  window.__R = { teams, people, projects, judges, criteria, committees, tracks, settings,
                 d1, d2, rate, certs, orgs, submitted, done, expected, byTrack, cats,
                 ranked, sq, responded, numeric, overall, comments, choices, flags };

  if(typeof paintLogos === 'function') paintLogos(document.getElementById('page'));

  const ctx = document.getElementById('chTracks');
  if(ctx && window.Chart){
    new Chart(ctx, {
      type:'doughnut',
      data:{ labels: byTrack.map(t=>t.name.replace('مسار ','')),
             datasets:[{ data: byTrack.map(t=>t.teams),
               backgroundColor:['#DB8A52','#35C9AE','#5B7FB5','#9B8ABF'] }] },
      options:{ maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'IBM Plex Sans Arabic' } } } } }
    });
  }
}


/* ================= تصدير عرض تقديمي ================= */
const NAVY='0E1422', SURF='182036', TEAL='35C9AE', AMBER='DB8A52',
      WHITE='FFFFFF', MUTED='96A3B8', LINE='2B3652';

function slideBase(pres, title){
  const sl = pres.addSlide();
  sl.background = { color: NAVY };
  if(title){
    sl.addText(title, { x:0.55, y:0.42, w:8.9, h:0.6, align:'right', rtlMode:true,
      fontFace:'Tajawal', fontSize:26, bold:true, color:WHITE, isTextBox:true, margin:0 });
  }
  return sl;
}

function kpiRow(sl, items, y){
  const n = items.length, gap = 0.18;
  const w = (8.9 - gap * (n - 1)) / n;
  items.forEach((it, k) => {
    const x = 0.55 + k * (w + gap);
    sl.addShape('roundRect', { x, y, w, h:1.15, rectRadius:0.09,
      fill:{ color:SURF }, line:{ color:LINE, width:1 } });
    sl.addText(String(it.n), { x, y:y+0.16, w, h:0.5, align:'center', rtlMode:true,
      fontFace:'Tajawal', fontSize:26, bold:true, color:TEAL, isTextBox:true, margin:0 });
    sl.addText(it.l, { x, y:y+0.68, w, h:0.32, align:'center', rtlMode:true,
      fontFace:'IBM Plex Sans Arabic', fontSize:10, color:MUTED, isTextBox:true, margin:0 });
  });
}

function tableRows(sl, head, rows, y, colW, x, w){
  sl.addTable([
      head.map(h => ({ text:h, options:{ bold:true, color:MUTED, fontSize:10 } })),
      ...rows.map(r => r.map(c => ({ text:String(c), options:{ color:WHITE, fontSize:11 } })))
    ], {
    x: x ?? 0.55, y, w: w ?? 8.9, colW, rtlMode:true, align:'right',
    fontFace:'IBM Plex Sans Arabic',
    border:{ type:'solid', color:LINE, pt:1 },
    fill:{ color:NAVY }, margin:6,
  });
}

/* تحميل المكتبة من مصدر بديل إن تعذّر الأول */
function loadPptx(){
  if(typeof PptxGenJS !== 'undefined') return Promise.resolve(true);
  return new Promise(resolve => {
    const sc = document.createElement('script');
    sc.src = 'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
    sc.onload  = () => resolve(typeof PptxGenJS !== 'undefined');
    sc.onerror = () => resolve(false);
    document.head.appendChild(sc);
  });
}

async function exportDeck(){
  const R = window.__R;
  if(!R){
    alert('لم تكتمل قراءة البيانات بعد. انتظر ظهور التقرير ثم أعد المحاولة.');
    return;
  }
  const btn = document.getElementById('pptBtn');
  btn.disabled = true; btn.textContent = 'جاري تحميل المكتبة...';
  const ready = await loadPptx();
  if(!ready){
    btn.disabled = false; btn.textContent = 'تصدير PowerPoint';
    alert('تعذّر تحميل مكتبة العروض التقديمية.\n'
        + 'تأكد من الاتصال بالإنترنت، أو أن الشبكة لا تحجب cdn.jsdelivr.net و unpkg.com.\n'
        + 'يمكنك بديلًا استخدام «طباعة / PDF».');
    return;
  }
  btn.disabled = true; btn.textContent = 'جاري التجهيز...';

  try{
    const pres = new PptxGenJS();
    pres.layout = 'LAYOUT_16x9';
    pres.rtlMode = true;
    pres.title = 'التقرير الختامي — صنّاع الحلول الابتكارية';

    const S = R.settings;
    const dt = d => d ? new Date(d).toLocaleDateString('ar-SA-u-ca-gregory',
      { day:'numeric', month:'long', year:'numeric' }) : '';

    /* ---- الغلاف ---- */
    const c = slideBase(pres, null);
    if(typeof LOGOS === 'object'){
      c.addImage({ data: LOGOS['qu'],  x:7.55, y:0.42, w:1.9,  h:0.58 });
      c.addImage({ data: LOGOS['mim'], x:5.45, y:0.42, w:1.95, h:0.58 });
    }
    c.addText('التقرير الختامي', { x:0.6, y:2.0, w:8.8, h:0.9, align:'right', rtlMode:true,
      fontFace:'Tajawal', fontSize:44, bold:true, color:WHITE, isTextBox:true, margin:0 });
    c.addText('صنّاع الحلول الابتكارية', { x:0.6, y:2.95, w:8.8, h:0.5, align:'right', rtlMode:true,
      fontFace:'Tajawal', fontSize:20, color:TEAL, isTextBox:true, margin:0 });
    c.addText(`${dt(S.day1_date)} — ${dt(S.day2_date)}   ·   ${S.event_location || 'جامعة القصيم'}\nبالشراكة مع وزارة الصناعة والثروة المعدنية`,
      { x:0.6, y:3.55, w:8.8, h:0.8, align:'right', rtlMode:true,
        fontFace:'IBM Plex Sans Arabic', fontSize:12, color:MUTED, isTextBox:true, margin:0, lineSpacingMultiple:1.4 });

    /* ---- الملخص ---- */
    const s1 = slideBase(pres, 'الملخص التنفيذي');
    s1.addText(`شارك ${R.teams.length} فريقًا ضمّت ${R.people.length} مشاركًا من ${R.orgs} جهة، `
      + `عملوا على تحديات واقعية في ${R.tracks.length} مسارات، وقُيّمت مشاريعهم من ${R.judges.length} محكّمين `
      + `عبر ${R.criteria.length} معايير.`,
      { x:0.55, y:1.15, w:8.9, h:0.7, align:'right', rtlMode:true,
        fontFace:'IBM Plex Sans Arabic', fontSize:13, color:'C3CFE1', isTextBox:true, margin:0, lineSpacingMultiple:1.5 });
    kpiRow(s1, [
      { n:R.teams.length,  l:'فريق مشارك' },
      { n:R.people.length, l:'مشارك' },
      { n:R.orgs,          l:'جهة' },
      { n:R.submitted,     l:'عرض مُسلَّم' },
      { n:R.rate + '%',    l:'نسبة الحضور' },
      { n:R.certs,         l:'شهادة صادرة' },
    ], 2.1);

    /* ---- المشاركة ---- */
    const s2 = slideBase(pres, 'المشاركة');
    s2.addChart(pres.ChartType.bar, [{
      name:'الفرق',
      labels:R.byTrack.map(t => t.name.replace('مسار ','')),
      values:R.byTrack.map(t => t.teams),
    }], { x:0.55, y:1.5, w:4.1, h:3.2, barDir:'col',
      chartColors:[TEAL, AMBER], showTitle:false,
      showValue:true, dataLabelPosition:'outEnd', dataLabelColor:WHITE, dataLabelFontSize:11,
      catAxisLabelColor:MUTED, catAxisLabelFontSize:10,
      valAxisLabelColor:MUTED, valAxisMinVal:0,
      valGridLine:{ color:LINE, size:1 }, catGridLine:{ style:'none' },
      showLegend:false, chartArea:{ fill:{ color:NAVY } } });
    s2.addText('الفرق لكل مسار', { x:0.55, y:1.15, w:4.1, h:0.3, align:'right',
      rtlMode:true, fontFace:'Tajawal', fontSize:13, bold:true, color:WHITE, isTextBox:true, margin:0 });

    const catRows = Object.entries(R.cats).sort((a,b)=>b[1]-a[1])
      .map(([k,v]) => [k, v, Math.round(v*100/R.people.length) + '%']);
    tableRows(s2, ['الفئة','العدد','النسبة'], catRows, 1.5, [2.5, 0.9, 0.9], 5.05, 4.4);
    s2.addText('توزيع المشاركين على الفئات', { x:5.05, y:1.15, w:4.4, h:0.3, align:'right',
      rtlMode:true, fontFace:'Tajawal', fontSize:13, bold:true, color:WHITE, isTextBox:true, margin:0 });

    /* ---- الحضور ---- */
    const s3 = slideBase(pres, 'الحضور والشهادات');
    kpiRow(s3, [
      { n:R.d1, l:'حضور اليوم الأول' },
      { n:R.d2, l:'حضور اليوم الثاني' },
      { n:R.people.filter(p=>p.day1_attended&&p.day2_attended).length, l:'حضروا اليومين' },
      { n:R.certs, l:'شهادة صادرة' },
    ], 1.5);
    s3.addText(`شرط الشهادة: حضور ${S.min_attendance_days === 2 ? 'اليومين' : 'يوم واحد على الأقل'}`
      + (S.require_survey ? '، مع تعبئة استبيان التقييم.' : '.'),
      { x:0.55, y:3.0, w:8.9, h:0.4, align:'right', rtlMode:true,
        fontFace:'IBM Plex Sans Arabic', fontSize:12, color:MUTED, isTextBox:true, margin:0 });

    /* ---- المشاريع والتحكيم ---- */
    const s4 = slideBase(pres, 'المشاريع والتحكيم');
    kpiRow(s4, [
      { n:R.projects.length, l:'مشروع' },
      { n:R.submitted,       l:'عرض مرفوع' },
      { n:R.flags.proto,     l:'نموذج مصغر' },
      { n:R.flags.pat,       l:'براءة اختراع' },
      { n:R.judges.length,   l:'محكّم' },
      { n:R.committees.length, l:'لجنة' },
    ], 1.25);
    tableRows(s4, ['معيار التحكيم','الوزن','أعلى درجة'],
      R.criteria.map(c => [c.name_ar, c.weight + '%', c.max_score]), 2.8, [4.2, 1.0, 1.0], 1.35, 6.2);

    /* ---- النتائج ---- */
    R.tracks.forEach(tr => {
      const rows = R.ranked[tr.id] || [];
      if(!rows.length) return;
      const sl = slideBase(pres, 'النتائج — ' + tr.name_ar.replace('مسار ',''));
      const accent = tr.id === 'safety' ? AMBER : TEAL;
      rows.forEach((r, k) => {
        const y = 1.35 + k * 1.15;
        sl.addShape('roundRect', { x:0.55, y, w:8.9, h:0.95, rectRadius:0.09,
          fill:{ color:SURF }, line:{ color: k === 0 ? accent : LINE, width:1 } });
        sl.addText(String(k+1), { x:8.55, y:y+0.22, w:0.7, h:0.5, align:'center', rtlMode:true,
          fontFace:'Tajawal', fontSize:20, bold:true, color:accent, isTextBox:true, margin:0 });
        sl.addText(r.name, { x:2.2, y:y+0.14, w:6.2, h:0.36, align:'right', rtlMode:true,
          fontFace:'Tajawal', fontSize:16, bold:true, color:WHITE, isTextBox:true, margin:0 });
        sl.addText(r.project_title || '', { x:2.2, y:y+0.5, w:6.2, h:0.3, align:'right', rtlMode:true,
          fontFace:'IBM Plex Sans Arabic', fontSize:11, color:MUTED, isTextBox:true, margin:0 });
        sl.addText(r.final_score + '%', { x:0.75, y:y+0.26, w:1.3, h:0.45, align:'left', rtlMode:true,
          fontFace:'Tajawal', fontSize:18, bold:true, color:WHITE, isTextBox:true, margin:0 });
      });
    });

    /* ---- الرضا ---- */
    if(R.numeric.length){
      const s5 = slideBase(pres, 'رضا المشاركين');
      s5.addChart(pres.ChartType.bar, [{
        name:'المتوسط',
        labels:R.numeric.map(q => q.question.replace(/^كيف تقيّم\s*/,'').replace(/؟$/,'')),
        values:R.numeric.map(q => Number(q.avg_num) || 0),
      }], { x:0.55, y:1.2, w:8.9, h:3.5, barDir:'bar',
        chartColors:[TEAL], showTitle:false,
        showValue:true, dataLabelPosition:'outEnd', dataLabelColor:WHITE, dataLabelFontSize:10,
        dataLabelFormatCode:'0.0',
        catAxisLabelColor:MUTED, catAxisLabelFontSize:9,
        valAxisLabelColor:MUTED, valAxisMinVal:0, valAxisMaxVal:10,
        valGridLine:{ color:LINE, size:1 }, catGridLine:{ style:'none' },
        showLegend:false, chartArea:{ fill:{ color:NAVY } } });
      s5.addText(`${R.responded} رد من ${R.people.length} مشاركًا`,
        { x:0.55, y:4.8, w:8.9, h:0.3, align:'right', rtlMode:true,
          fontFace:'IBM Plex Sans Arabic', fontSize:11, color:MUTED, isTextBox:true, margin:0 });
    }

    /* ---- الملاحظات ---- */
    if(R.comments.length){
      const s6 = slideBase(pres, 'من ملاحظات المشاركين');
      R.comments.slice(0,4).forEach((t, k) => {
        const y = 1.3 + k * 0.95;
        s6.addShape('roundRect', { x:0.55, y, w:8.9, h:0.78, rectRadius:0.08,
          fill:{ color:SURF }, line:{ color:LINE, width:1 } });
        s6.addText(t, { x:0.8, y:y+0.1, w:8.4, h:0.58, align:'right', rtlMode:true,
          fontFace:'IBM Plex Sans Arabic', fontSize:11, color:'C3CFE1',
          isTextBox:true, margin:0, valign:'middle', shrinkText:true });
      });
    }

    /* ---- الختام ---- */
    const s7 = slideBase(pres, null);
    s7.addText('شكرًا لكم', { x:0.6, y:2.3, w:8.8, h:0.9, align:'center', rtlMode:true,
      fontFace:'Tajawal', fontSize:40, bold:true, color:WHITE, isTextBox:true, margin:0 });
    s7.addText('مركز الابتكار والملكية الفكرية · جامعة القصيم',
      { x:0.6, y:3.25, w:8.8, h:0.4, align:'center', rtlMode:true,
        fontFace:'IBM Plex Sans Arabic', fontSize:12, color:MUTED, isTextBox:true, margin:0 });

    await pres.writeFile({ fileName:'التقرير-الختامي.pptx' });
  } catch(e){
    alert('تعذّر إنشاء العرض: ' + (e.message || e));
  } finally {
    btn.disabled = false; btn.textContent = 'تصدير PowerPoint';
  }
}

function exportAll(){
  const wb = XLSX.utils.book_new();
  const add = (rows, name) =>
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), name);

  add(D.teams.map(t=>({
    'رقم التسجيل':t.reg_no||t.code,'الفريق':t.name,
    'المسار':(D.tracks.find(x=>x.id===t.track_id)||{}).name_ar||'',
    'الأعضاء':D.people.filter(p=>p.team_id===t.id).length,
    'العرض':(D.projects.find(p=>p.team_id===t.id)||{}).presentation_url||'',
  })), 'الفرق');

  add(D.people.map(p=>({
    'الاسم':p.full_name,'البريد':p.email,'الجوال':p.phone,'الجهة':p.organization||'',
    'الفئة':p.category||'','المدينة':p.city||'','الجنس':p.gender||'',
    'اليوم 1':p.day1_attended?'حاضر':'','اليوم 2':p.day2_attended?'حاضر':'',
    'الشهادة':p.certificate_code||'',
  })), 'المشاركون');

  add(D.results.map(r=>({
    'المسار':r.track_name,'الفريق':r.name,'المشروع':r.project_title||'',
    'المحكّمون':r.judges_count,'النتيجة %':r.final_score,
  })), 'النتائج');

  add((D.surveyQ||[]).map(q=>({
    'السؤال':q.question,'النوع':q.qtype,'عدد الإجابات':q.answers,
    'المتوسط':q.avg_num ?? '',
    'التوزيع':q.breakdown ? JSON.stringify(q.breakdown) : '',
  })), 'الاستبيان');

  XLSX.writeFile(wb, 'التقرير-الختامي.xlsx');
}
