<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقرير الختامي — صنّاع الحلول الابتكارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{--navy:#0E1938;--ink:#1B2436;--teal:#35C9AE;--amber:#DB8A52;
    --line:#E3E8EF;--muted:#69788E;--bg:#F6F7F9;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;}
  h1,h2,h3{font-family:'Tajawal',sans-serif;margin:0;}

  /* الدخول */
  .login{max-width:380px;margin:14vh auto;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:28px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;}
  input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;
    font-family:inherit;font-size:15px;}
  button.b{border:none;border-radius:11px;padding:12px 18px;font-family:'Tajawal',sans-serif;
    font-weight:700;font-size:14.5px;cursor:pointer;}
  .b-teal{background:var(--teal);color:#fff;}
  .b-ghost{background:#fff;border:1px solid var(--line);color:var(--navy);}
  .msg{font-size:13px;padding:11px 13px;border-radius:9px;margin-top:12px;display:none;
    background:#fdecec;color:#9c2b2b;}
  .msg.on{display:block;}
  .hide{display:none !important;}

  .toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);
    padding:12px 20px;display:flex;gap:9px;justify-content:flex-end;align-items:center;}
  .toolbar .sp{flex:1;font-size:13px;color:var(--muted);}

  .page{max-width:940px;margin:0 auto;padding:26px 20px 80px;}

  .cover{background:var(--navy);color:#fff;border-radius:18px;padding:44px;margin-bottom:22px;
    position:relative;overflow:hidden;}
  .cover::after{content:'';position:absolute;left:-90px;bottom:-150px;width:420px;height:420px;
    border-radius:50%;background:radial-gradient(circle,rgba(53,201,174,.16) 0%,transparent 70%);}
  .cover .logos{display:flex;align-items:center;gap:18px;margin-bottom:28px;}
  .cover .logos img{height:44px;}
  .cover .logos .sep{width:1px;height:34px;background:#35507A;}
  .cover h1{font-size:34px;position:relative;}
  .cover .sub{color:var(--teal);font-size:15px;margin-top:10px;position:relative;}
  .cover .meta{font-size:13px;color:#B9C6DA;margin-top:20px;line-height:1.9;position:relative;}

  section{background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:24px;margin-bottom:18px;}
  section > h2{font-size:19px;padding-bottom:12px;border-bottom:2px solid var(--navy);}
  section .lead{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.9;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:18px;}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;}
  .kpi .n{font-family:'Tajawal',sans-serif;font-size:28px;font-weight:900;color:var(--navy);}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:5px;}

  table{width:100%;border-collapse:collapse;margin-top:16px;}
  th,td{padding:10px 11px;text-align:right;font-size:13px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-size:11.5px;font-weight:600;}
  tbody tr:last-child td{border-bottom:none;}

  .bar{height:8px;border-radius:999px;background:#EEF1F5;overflow:hidden;margin-top:6px;}
  .bar i{display:block;height:100%;background:var(--teal);}
  .bar.amber i{background:var(--amber);}

  .win{display:flex;align-items:center;gap:16px;border:1px solid var(--line);
    border-radius:14px;padding:18px;margin-top:12px;}
  .win .rk{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-family:'Tajawal',sans-serif;font-weight:900;font-size:17px;
    background:rgba(53,201,174,.14);color:#0F7A68;flex-shrink:0;}
  .win.safety .rk{background:rgba(219,138,82,.16);color:#9E5F33;}
  .win .nm{font-family:'Tajawal',sans-serif;font-weight:700;font-size:16px;}
  .win .pj{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .win .sc{margin-inline-start:auto;font-family:'Tajawal',sans-serif;font-weight:900;
    font-size:19px;color:var(--navy);}

  .quote{border-inline-start:3px solid var(--teal);padding:10px 14px;margin-top:10px;
    font-size:13px;line-height:1.9;color:#3C4A62;background:#FAFBFC;border-radius:0 8px 8px 0;}
  .chartbox{margin-top:18px;height:260px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:760px){ .two{grid-template-columns:1fr;} }

  @media print{
    body{background:#fff;}
    .toolbar{display:none;}
    .page{max-width:none;padding:0;}
    section{break-inside:avoid;border:none;padding:16px 0;border-bottom:1px solid var(--line);
      border-radius:0;margin-bottom:0;}
    .cover{border-radius:0;break-after:page;}
  }
</style>
</head>
<body>

<div class="login" id="loginCard">
  <h2 style="font-size:20px;">التقرير الختامي</h2>
  <div style="font-size:12.5px;color:var(--muted);margin-top:6px;">دخول فريق التنظيم.</div>
  <label for="le">البريد الإلكتروني</label>
  <input type="email" id="le" dir="ltr" style="text-align:right;">
  <label for="lp">كلمة المرور</label>
  <input type="password" id="lp">
  <button class="b b-teal" style="width:100%;margin-top:18px;" onclick="login()">دخول</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="app" class="hide">
  <div class="toolbar">
    <span class="sp" id="stamp"></span>
    <button class="b b-ghost" onclick="exportAll()">تصدير البيانات</button>
    <button class="b b-teal" onclick="window.print()">طباعة / PDF</button>
  </div>
  <div class="page" id="page"></div>
</div>

<script src="config.js"></script>
<script>
let D = {};

supabaseClient.auth.onAuthStateChange(async (_e, session) => {
  if(!session) return;
  const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
  if(!prof){
    const m = document.getElementById('loginMsg');
    m.className = 'msg on'; m.textContent = 'هذا الحساب غير مُضاف إلى فريق التنظيم.';
    await supabaseClient.auth.signOut(); return;
  }
  document.getElementById('loginCard').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  load();
});
async function login(){
  const { error } = await supabaseClient.auth.signInWithPassword({
    email: document.getElementById('le').value.trim(),
    password: document.getElementById('lp').value });
  if(error){
    const m = document.getElementById('loginMsg');
    m.className = 'msg on'; m.textContent = 'بيانات الدخول غير صحيحة.';
  }
}

const arDate = d => d ? new Date(d).toLocaleDateString('ar-SA-u-ca-gregory',
  { day:'numeric', month:'long', year:'numeric' }) : '';

async function load(){
  const [tr,ch,tm,pp,pr,jd,cr,cm,cmm,ev,sv,st,rs] = await Promise.all([
    supabaseClient.from('tracks').select('*').order('sort_order'),
    supabaseClient.from('challenges').select('*'),
    supabaseClient.from('teams').select('*'),
    supabaseClient.from('participants').select('*'),
    supabaseClient.from('projects').select('*'),
    supabaseClient.from('judges').select('*'),
    supabaseClient.from('judging_criteria').select('*').order('sort_order'),
    supabaseClient.from('judging_committees').select('*'),
    supabaseClient.from('committee_members').select('*'),
    supabaseClient.from('judge_evaluations').select('*'),
    supabaseClient.from('event_evaluations').select('*'),
    supabaseClient.from('app_settings').select('*').eq('id',1).single(),
    supabaseClient.from('v_team_results').select('*'),
  ]);
  D = { tracks:tr.data||[], challenges:ch.data||[], teams:tm.data||[], people:pp.data||[],
        projects:pr.data||[], judges:jd.data||[], criteria:cr.data||[], committees:cm.data||[],
        comMembers:cmm.data||[], evals:ev.data||[], surveys:sv.data||[],
        settings:st.data||{}, results:(rs.data||[]) };
  render();
}

function avg(arr){ return arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*100)/100 : null; }

function render(){
  const { tracks, teams, people, projects, judges, criteria, committees,
          evals, surveys, settings, results } = D;

  const d1 = people.filter(p=>p.day1_attended).length;
  const d2 = people.filter(p=>p.day2_attended).length;
  const rate = people.length ? Math.round((d1+d2)*100/(people.length*2)) : 0;
  const certs = people.filter(p=>p.certificate_issued).length;
  const orgs = new Set(people.map(p=>(p.organization||'').trim()).filter(Boolean)).size;
  const submitted = projects.filter(p=>p.presentation_url).length;
  const done = evals.filter(e=>e.submitted).length;
  const expected = teams.filter(t=>t.committee_id).reduce((n,t) =>
    n + D.comMembers.filter(m=>m.committee_id===t.committee_id).length, 0);

  const byTrack = tracks.map(t => ({
    name: t.name_ar, id: t.id,
    teams: teams.filter(x=>x.track_id===t.id).length,
    people: people.filter(x=>x.track_id===t.id).length,
  }));
  const cats = {};
  people.forEach(p => { const c=(p.category||'غير محدد').trim(); cats[c]=(cats[c]||0)+1; });

  const ranked = {};
  tracks.forEach(t => {
    ranked[t.id] = results.filter(r=>r.track_id===t.id && r.final_score!=null)
                          .sort((a,b)=>b.final_score-a.final_score).slice(0,3);
  });

  const sAvg = k => avg(surveys.map(s=>s[k]).filter(x=>x!=null));
  const recommend = surveys.length
    ? Math.round(surveys.filter(s=>s.would_recommend).length*100/surveys.length) : null;
  const comments = surveys.map(s=>s.comment).filter(Boolean).slice(0,5);

  const flags = {
    cr: projects.filter(p=>p.has_commercial_register).length,
    pat: projects.filter(p=>p.has_patent).length,
    proto: projects.filter(p=>p.has_prototype).length,
  };

  document.getElementById('stamp').textContent = 'صدر في ' + arDate(new Date());

  document.getElementById('page').innerHTML = `
    <div class="cover">
      <div class="logos">
        <img data-logo="qu" alt="جامعة القصيم"><span class="sep"></span>
        <img data-logo="mim" alt="وزارة الصناعة والثروة المعدنية">
      </div>
      <h1>التقرير الختامي</h1>
      <div class="sub">صنّاع الحلول الابتكارية</div>
      <div class="meta">
        ${arDate(settings.day1_date)} — ${arDate(settings.day2_date)}<br>
        ${settings.event_location || 'جامعة القصيم'} · بالشراكة مع وزارة الصناعة والثروة المعدنية
      </div>
    </div>

    <section>
      <h2>الملخص التنفيذي</h2>
      <div class="lead">
        أقيمت فعالية صنّاع الحلول الابتكارية بالشراكة بين جامعة القصيم ووزارة الصناعة والثروة المعدنية،
        بمشاركة ${teams.length} فريقًا ضمّت ${people.length} مشاركًا من ${orgs} جهة،
        عملوا على تحديات واقعية في ${tracks.length} مسارات، وقُيّمت مشاريعهم من ${judges.length} محكّمين
        عبر ${criteria.length} معايير.
      </div>
      <div class="kpis">
        <div class="kpi"><div class="n">${teams.length}</div><div class="l">فريق مشارك</div></div>
        <div class="kpi"><div class="n">${people.length}</div><div class="l">مشارك</div></div>
        <div class="kpi"><div class="n">${orgs}</div><div class="l">جهة</div></div>
        <div class="kpi"><div class="n">${submitted}</div><div class="l">عرض مُسلَّم</div></div>
        <div class="kpi"><div class="n">${rate}%</div><div class="l">نسبة الحضور</div></div>
        <div class="kpi"><div class="n">${certs}</div><div class="l">شهادة صادرة</div></div>
      </div>
    </section>

    <section>
      <h2>المشاركة</h2>
      <div class="two">
        <div>
          <table>
            <thead><tr><th>المسار</th><th>الفرق</th><th>المشاركون</th></tr></thead>
            <tbody>${byTrack.map(t=>`<tr><td>${t.name}</td><td>${t.teams}</td><td>${t.people}</td></tr>`).join('')}
              <tr><td><b>الإجمالي</b></td><td><b>${teams.length}</b></td><td><b>${people.length}</b></td></tr>
            </tbody>
          </table>
        </div>
        <div class="chartbox"><canvas id="chTracks"></canvas></div>
      </div>

      <table style="margin-top:22px;">
        <thead><tr><th>الفئة</th><th>العدد</th><th style="width:45%;">النسبة</th></tr></thead>
        <tbody>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
          <tr><td>${k}</td><td>${v}</td>
            <td><div class="bar"><i style="width:${Math.round(v*100/people.length)}%"></i></div></td></tr>`).join('')}
        </tbody>
      </table>
    </section>

    <section>
      <h2>الحضور والشهادات</h2>
      <div class="kpis">
        <div class="kpi"><div class="n">${d1}</div><div class="l">حضور اليوم الأول</div></div>
        <div class="kpi"><div class="n">${d2}</div><div class="l">حضور اليوم الثاني</div></div>
        <div class="kpi"><div class="n">${people.filter(p=>p.day1_attended&&p.day2_attended).length}</div>
          <div class="l">حضروا اليومين</div></div>
        <div class="kpi"><div class="n">${certs}</div><div class="l">شهادة صادرة</div></div>
      </div>
      <div class="lead">
        شرط الشهادة: حضور ${settings.min_attendance_days === 2 ? 'اليومين' : 'يوم واحد على الأقل'}${
          settings.require_survey ? '، مع تعبئة استبيان التقييم' : ''}.
      </div>
    </section>

    <section>
      <h2>المشاريع</h2>
      <div class="kpis">
        <div class="kpi"><div class="n">${projects.length}</div><div class="l">مشروع مسجَّل</div></div>
        <div class="kpi"><div class="n">${submitted}</div><div class="l">عرض مرفوع</div></div>
        <div class="kpi"><div class="n">${flags.proto}</div><div class="l">نموذج مصغر</div></div>
        <div class="kpi"><div class="n">${flags.pat}</div><div class="l">براءة اختراع</div></div>
        <div class="kpi"><div class="n">${flags.cr}</div><div class="l">سجل تجاري</div></div>
      </div>
    </section>

    <section>
      <h2>التحكيم</h2>
      <div class="kpis">
        <div class="kpi"><div class="n">${judges.length}</div><div class="l">محكّم</div></div>
        <div class="kpi"><div class="n">${committees.length}</div><div class="l">لجنة</div></div>
        <div class="kpi"><div class="n">${done}</div><div class="l">تقييم معتمَد</div></div>
        <div class="kpi"><div class="n">${expected ? Math.round(done*100/expected) : 0}%</div>
          <div class="l">اكتمال التحكيم</div></div>
      </div>
      <table>
        <thead><tr><th>المعيار</th><th>الوزن</th><th>أعلى درجة</th></tr></thead>
        <tbody>${criteria.map(c=>`<tr><td>${c.name_ar}</td><td>${c.weight}%</td><td>${c.max_score}</td></tr>`).join('')}</tbody>
      </table>
    </section>

    <section>
      <h2>النتائج</h2>
      ${tracks.map(t => `
        <h3 style="font-size:15px;margin-top:18px;">${t.name_ar}</h3>
        ${(ranked[t.id]||[]).length ? ranked[t.id].map((r,ix)=>`
          <div class="win ${t.id}">
            <div class="rk">${ix+1}</div>
            <div><div class="nm">${r.name}</div>
              ${r.project_title?`<div class="pj">${r.project_title}</div>`:''}</div>
            <div class="sc">${r.final_score}%</div>
          </div>`).join('')
        : '<div class="lead">لم تكتمل نتائج هذا المسار.</div>'}
      `).join('')}
    </section>

    <section>
      <h2>رضا المشاركين</h2>
      ${surveys.length ? `
      <div class="kpis">
        <div class="kpi"><div class="n">${surveys.length}</div><div class="l">رد من ${people.length}</div></div>
        <div class="kpi"><div class="n">${sAvg('rating_overall') ?? '—'}</div><div class="l">التقييم العام (5)</div></div>
        <div class="kpi"><div class="n">${recommend ?? '—'}%</div><div class="l">يوصون بالمشاركة</div></div>
      </div>
      <table>
        <thead><tr><th>المحور</th><th>المتوسط</th><th style="width:40%;"></th></tr></thead>
        <tbody>${[
          ['المحتوى والتحديات','rating_content'],
          ['التنظيم والمرافق','rating_organization'],
          ['الإرشاد والدعم','rating_mentorship'],
          ['آلية التحكيم','rating_judging'],
          ['التجربة عمومًا','rating_overall'],
        ].map(([l,k])=>{ const v=sAvg(k);
          return `<tr><td>${l}</td><td>${v ?? '—'}</td>
            <td><div class="bar"><i style="width:${v?v/5*100:0}%"></i></div></td></tr>`;}).join('')}
        </tbody>
      </table>
      ${comments.length ? `<h3 style="font-size:14.5px;margin-top:22px;">من ملاحظات المشاركين</h3>
        ${comments.map(c=>`<div class="quote">${c}</div>`).join('')}` : ''}
      ` : '<div class="lead">لم تصل ردود على الاستبيان.</div>'}
    </section>`;

  if(typeof paintLogos === 'function') paintLogos(document.getElementById('page'));

  const ctx = document.getElementById('chTracks');
  if(ctx && window.Chart){
    new Chart(ctx, {
      type:'doughnut',
      data:{ labels: byTrack.map(t=>t.name.replace('مسار ','')),
             datasets:[{ data: byTrack.map(t=>t.teams),
               backgroundColor:['#DB8A52','#35C9AE','#5B7FB5','#9B8ABF'] }] },
      options:{ maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'IBM Plex Sans Arabic' } } } } }
    });
  }
}

function exportAll(){
  const wb = XLSX.utils.book_new();
  const add = (rows, name) =>
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), name);

  add(D.teams.map(t=>({
    'رقم التسجيل':t.reg_no||t.code,'الفريق':t.name,
    'المسار':(D.tracks.find(x=>x.id===t.track_id)||{}).name_ar||'',
    'الأعضاء':D.people.filter(p=>p.team_id===t.id).length,
    'العرض':(D.projects.find(p=>p.team_id===t.id)||{}).presentation_url||'',
  })), 'الفرق');

  add(D.people.map(p=>({
    'الاسم':p.full_name,'البريد':p.email,'الجوال':p.phone,'الجهة':p.organization||'',
    'الفئة':p.category||'','المدينة':p.city||'','الجنس':p.gender||'',
    'اليوم 1':p.day1_attended?'حاضر':'','اليوم 2':p.day2_attended?'حاضر':'',
    'الشهادة':p.certificate_code||'',
  })), 'المشاركون');

  add(D.results.map(r=>({
    'المسار':r.track_name,'الفريق':r.name,'المشروع':r.project_title||'',
    'المحكّمون':r.judges_count,'النتيجة %':r.final_score,
  })), 'النتائج');

  add(D.surveys.map(s=>({
    'المحتوى':s.rating_content,'التنظيم':s.rating_organization,'الإرشاد':s.rating_mentorship,
    'التحكيم':s.rating_judging,'العام':s.rating_overall,
    'يوصي':s.would_recommend===true?'نعم':(s.would_recommend===false?'لا':''),
    'ملاحظات':s.comment||'',
  })), 'الاستبيان');

  XLSX.writeFile(wb, 'التقرير-الختامي.xlsx');
}
</script>
</body>
</html>
